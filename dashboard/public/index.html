<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Affine subnet 120. Actual held-out evaluation performance over time and batches per epoch.">
<title>Affine</title>
<link rel="icon" href="/network-favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/network.css?v=20261002-two-charts"><script src="/network.js?v=20261002-two-charts" defer></script>
</head>
<body>
<header><a class="wordmark" href="/" aria-label="Affine home"><svg viewBox="0 0 22 23" aria-hidden="true"><path d="M2 20 11 3l9 17"/></svg><span>FFINE</span></a><div class="scope" aria-label="Data scope"><button data-scope="test" aria-pressed="true">Pilot tests</button><button data-scope="live" aria-pressed="false">Network</button></div></header>
<main>
<section aria-labelledby="evaluation-title">
<div class="section-label"><h1 id="evaluation-title">Evaluation performance / time</h1><div class="chart-controls"><label>Environment <select id="environment" aria-label="Select environment"></select></label><label>Cohort <select id="evaluation" aria-label="Select comparable evaluation cohort"></select></label></div></div>
<div class="chart-wrap"><svg id="evaluation-chart" role="img" aria-label="Held-out evaluation performance over time"></svg><p id="evaluation-empty" class="empty" hidden>No completed held-out evaluations yet.</p><output id="evaluation-tip" class="chart-tip" hidden></output></div>
<div class="chart-caption"><span id="evaluation-period">Completed evaluations · UTC</span><span id="evaluation-note">Actual held-out measurements</span></div>
</section>
<section aria-labelledby="batch-title">
<div class="section-label"><h2 id="batch-title">Batches / epoch</h2><label>Series <select id="batch-source" aria-label="Select epoch series"></select></label></div>
<div class="chart-wrap"><svg id="batch-chart" role="img" aria-label="Batches submitted per finalized epoch"></svg><p id="batch-empty" class="empty" hidden>No finalized epochs yet.</p><output id="batch-tip" class="chart-tip" hidden></output></div>
<div class="chart-caption"><span id="batch-period">Finalized epochs · UTC</span><span>Frozen submitted batches · accepted totals in tooltips</span></div>
</section>
</main>
<footer><span>Affine · Subnet 120</span><span id="connection" role="status">Connecting</span><a href="/llms.txt">llms.txt ↗</a></footer>
