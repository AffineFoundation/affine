[project]
name = "stirrup-agent"
version = "0.1.0"
description = "Artificial Analysis' Stirrup agent loop (code_exec + finish/abandon tools, GDPval-AA shape) as a verifiers harness; id `stirrup_agent`."
requires-python = ">=3.11"
dependencies = ["verifiers"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stirrup_agent"]
