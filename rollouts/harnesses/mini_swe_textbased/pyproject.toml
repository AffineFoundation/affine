[project]
name = "mini-swe-textbased"
version = "0.1.0"
description = "mini-swe-agent harness in text-based bash-fence mode (affine corpus action format)."
requires-python = ">=3.11"
dependencies = ["verifiers"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mini_swe_textbased"]
