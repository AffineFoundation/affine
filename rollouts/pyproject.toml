[project]
name = "rollouts"
version = "0.1.0"
description = "Unified rollout datagen: canonical trace store + Parquet index + derived views, deficit scheduler, multi-model/multi-harness policy matrix."
requires-python = ">=3.12,<3.14"
dependencies = [
    # Contract code reused from the affine member: datagen.slicer (turn
    # slicing byte-compatible with the production corpus) and
    # datagen.uploader (sha-manifested HF shard uploads).
    "affine",
    "datasets>=3.0",
    "huggingface_hub>=0.30",
    "pyarrow>=17",
    "pyyaml>=6",
    # Teacher chat template for affine.toolbake (tokenizer files only, no
    # weights): tool-use traces are baked into plain prefixes at slice time.
    "transformers>=4.51",
    # transformers renders chat templates with jinja2 but only lists it as an
    # optional extra; a `uv sync` on 2026-09-07 dropped it and the 16:00 fold
    # died in ToolBaker.from_pretrained(). Declare the real dependency.
    "jinja2>=3.1",
]

[tool.uv.sources]
affine = { workspace = true }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rollouts*"]

[tool.setuptools.package-data]
rollouts = ["*.toml"]
