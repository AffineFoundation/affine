[project]
name = "affine-ifeval-v1"
version = "0.1.0"
description = "affine-ifeval-v1 — verifiable instruction following: RLVR-IFeval train prompts (open-instruct checker, vendored) + optional Google IFEval rows (ifeval-v1 checker); single-turn text reply, `correct` reward."
requires-python = ">=3.10"
dependencies = ["datasets", "langdetect", "ifeval-v1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["affine_ifeval_v1"]
