[project]
name = "affine-trivia-v1"
version = "0.1.0"
description = "affine-trivia-v1 — TriviaQA closed-book QA (train split, zero-shot, system prompt, tasks selector), alias exact-match `correct` reward."
requires-python = ">=3.10"
dependencies = ["datasets", "triviaqa-v1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["affine_trivia_v1"]
