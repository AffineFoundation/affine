[project]
name = "affine-numina-v1"
version = "0.1.0"
description = "affine-numina-v1 — Lean 4 theorem proving on AI-MO/NuminaMath-LEAN in a Mathlib sandbox; `tasks` selector, `solved` reward (lean_compiled without the has_error guard), configurable image."
requires-python = ">=3.11"
dependencies = ["numina-v1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["affine_numina_v1"]
