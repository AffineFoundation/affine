[project]
name = "affine-tau2-gen-v1"
version = "0.1.0"
description = "affine-tau2-gen-v1 — tau2-gen (catoneone/tau2-gen) generated airline / retail / telecom tasks with per-task databases, disjoint from the tau2-bench base splits by construction; tau2 orchestrator, DeepSeek customer."
requires-python = ">=3.10"
dependencies = ["affine-tau2-synth-v1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["affine_tau2_gen_v1"]
artifacts = ["affine_tau2_gen_v1/data/**"]
