[project]
name = "affine-rcore-v1"
version = "0.1.0"
description = "affine-rcore-v1 — reasoning-core formally verified reasoning tasks (v1 port of sileod/reasoning-core-env); HF train rows, text dialect, correct reward."
requires-python = ">=3.10"
dependencies = ["reasoning-core>=0.1.15", "datasets"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["affine_rcore_v1"]
