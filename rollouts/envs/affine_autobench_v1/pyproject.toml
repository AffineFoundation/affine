[project]
name = "affine-autobench-v1"
version = "0.1.0"
description = "affine-autobench-v1 — Zapier AutomationBench (600 business-workflow tasks over a simulated 47-app SaaS workspace, automationbench-v1); `tasks` selector, binary `solved` = all assertions pass."
requires-python = ">=3.12"
dependencies = ["automationbench-v1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["affine_autobench_v1"]
