[project]
name = "affine-logic-v1"
version = "0.1.0"
description = "affine-logic-v1 — INTELLECT-3-RL logic puzzles (i3-logic-v1 verifiers), single-turn, plain-text answer, system-prompt + tasks selector, `correct` reward."
requires-python = ">=3.10"
dependencies = ["datasets", "i3-logic-v1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["affine_logic_v1"]
