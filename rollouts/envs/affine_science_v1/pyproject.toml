[project]
name = "affine-science-v1"
version = "0.1.0"
description = "affine-science-v1 — INTELLECT-3-RL science problems (i3-science-v1), single-turn \\boxed{} answer, math-verify only (judge fallback removed), tasks selector."
requires-python = ">=3.10"
dependencies = ["datasets", "i3-science-v1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["affine_science_v1"]
