[project]
name = "affine-wiki-v1"
version = "0.1.0"
description = "affine-wiki-v1 — wiki trivia over the wiki_search_v1 toolset with a system-message tool contract; whole question bank, no judge."
requires-python = ">=3.10"
dependencies = ["datasets", "wiki-search-v1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["affine_wiki_v1"]
