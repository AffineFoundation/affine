[project]
name = "affine-gdpval-v1"
version = "0.1.0"
description = "affine-gdpval-v1 — OpenAI GDPval tasks (220, reference files + rubrics) under Artificial Analysis' Stirrup harness; probe source, fold-excluded (benchmark tasks); protocol-level `solved` = finish + a non-empty submitted file."
requires-python = ">=3.11"
dependencies = ["datasets", "httpx", "filelock"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["affine_gdpval_v1"]
