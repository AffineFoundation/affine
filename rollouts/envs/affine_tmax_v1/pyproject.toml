[project]
name = "affine-tmax-v1"
version = "0.1.0"
description = "affine-tmax-v1 — TMax terminal tasks (PrimeIntellect-ai/prime-tasks, 14,600 Harbor task dirs) loaded from a local sparse git checkout with images built on the pod; Harbor verifier -> `solved`."
requires-python = ">=3.10"
dependencies = ["verifiers[harbor]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["affine_tmax_v1"]
