[project]
name = "affine-nl2lib-v1"
version = "0.1.0"
description = "affine-nl2lib-v1 — Commit0: implement a Python library from its spec + docstring skeleton in a sandbox (nl2repo group); pytest pass rate as guarded telemetry."
requires-python = ">=3.10"
dependencies = ["datasets"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["affine_nl2lib_v1"]
