[project]
name = "affine-tau2-synth-v1"
version = "0.1.0"
description = "affine-tau2-synth-v1 — τ²'s orchestrator on the ten tau2-synth customer-service domains (mikasenghaas/tau2-synth @ 798589e) with an LLM user simulator; taskset + harness, `solved` reward."
requires-python = ">=3.11"
dependencies = ["affine-tau2-v1"]

[build-system]
requires = ["hatchling"]
