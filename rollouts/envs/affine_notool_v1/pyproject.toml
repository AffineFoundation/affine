[project]
name = "affine-notool-v1"
version = "0.1.0"
description = "affine-notool-v1 — knowledge questions served WITH unrelated tool schemas (BFCL-irrelevance shape); the right reply is prose, no tool call. TriviaQA train items, `solved` = correct answer and zero tool calls."
requires-python = ">=3.10"
dependencies = ["datasets", "triviaqa-v1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["affine_notool_v1"]
