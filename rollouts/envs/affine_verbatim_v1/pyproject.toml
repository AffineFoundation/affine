[project]
name = "affine-verbatim-v1"
version = "0.1.0"
description = "affine-verbatim-v1 — copy generated text exactly inside <answer> tags (verbatim-copy-v1); per-index seeding, system message, correct reward."
requires-python = ">=3.10"
dependencies = ["verbatim-copy-v1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["affine_verbatim_v1"]
