[project]
name = "affine-mrcr-v1"
version = "0.1.0"
description = "affine-mrcr-v1 — MRCR v2 (openai/mrcr) long-context coreference solved from a file in the sandbox (mrcr-v2-v1); disjoint (needles, context) buckets only, task selector, system message, correct reward."
requires-python = ">=3.10"
dependencies = ["mrcr-v2-v1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["affine_mrcr_v1"]
