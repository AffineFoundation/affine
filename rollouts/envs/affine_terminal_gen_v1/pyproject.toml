[project]
name = "affine-terminal-gen-v1"
version = "0.1.0"
description = "affine-terminal-gen-v1 — generated terminal tasks (Stack Exchange posts -> Harbor task dirs via ops/terminal_gen, Docker-validated, decontaminated against Terminal-Bench 2.0 / 4.0), shipped per fold epoch as data/e<epoch>/tasks.tar.gz and built on the pod; Harbor verifier -> `solved`."
requires-python = ">=3.10"
dependencies = ["verifiers[harbor]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["affine_terminal_gen_v1"]
artifacts = ["affine_terminal_gen_v1/data/**"]
