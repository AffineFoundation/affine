[project]
name = "affine-pydantic-v1"
version = "0.1.0"
description = "affine-pydantic-v1 — structured output: JSON validated against a per-row Pydantic model (v1 port of primeintellect/pydantic-adherence); text dialect, correct reward."
requires-python = ">=3.10"
dependencies = ["datasets", "pydantic>=2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["affine_pydantic_v1"]
