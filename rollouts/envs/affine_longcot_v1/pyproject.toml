[project]
name = "affine-longcot-v1"
version = "0.1.0"
description = "affine-longcot-v1 — LongCoT long-horizon reasoning (logic/cs/chemistry/chess/math) in a sandbox; question-id task selector, system message, `correct` reward (longcot-v1)."
requires-python = ">=3.10"
dependencies = ["longcot-v1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["affine_longcot_v1"]
