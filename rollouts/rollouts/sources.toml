# "Do not act" states (improvement-loop P1, 2026-09-13): knowledge
# questions served WITH 3-6 unrelated tool schemas — the BFCL-irrelevance
# shape, built in-house (rollouts/envs/affine_notool_v1; BFCL itself is a
