# Source registry: every task source is one declarative block.
# Adding a source = adding one block (+ a catalog builder if its kind is new).
#
# [mix] targets are shares of KEPT TURNS (records that survive the
# duel_turns view + prefilter) per group — not attempts. The scheduler
# steers generation toward these; ops/datagen_refresh.py enforces the same
# targets at fold time.

[mix]
# ONE table for generation (rollouts scheduler: deficit per source-backed
# group) and for the fold (ops/corpus_build.py: slice-strata shares
# enforced by cap_fill). The [fold_mix] override existed 2026-09-11 only
# to hold `general` at 0.0 while its sources built a backlog; phase 3
# (2026-09-12) sets general = 0.05 and folds the two tables back into one.
# Groups without a source (king_*, completion) are fold-routed; the
# scheduler ignores them.
#
# History: 2026-09-01 math + tool_use generated ahead of the wvk-11 fork;
# 2026-09-10 + king_fail 0.10; 2026-09-11 king_fail 0.07 + king_loop_onset
# 0.03, then + king_pivot 0.02 (out of king_fail) and completion 0.03 (out
# of coding / terminal / math); env wave 1 + general.
#
# 2026-09-12 phase 3 (docs/duel-signal-by-group.md, 52 verdicts joined to
# the view index): coding and terminal carry 87 % of the paired variance
# and terminal has the best signal per slot; math is 92 % R-dead (teacher
# refs identical -> centered R = 0) and tool_use 58 %; king_fail's strata
# were 83 % wiki + math king failures. Operator vector (addendum, general
# 0.05 taken from tool_use): coding 0.44 / terminal 0.27 / king_fail 0.08 /
# king_loop_onset 0.03 / king_pivot 0.02 / completion 0.03 / nl2repo 0.03 /
# math 0.03 / tool_use 0.02 / general 0.05. cap_fill's anchor rule (target
# >= 0.1: coding, terminal) holds terminal to 0.27/0.44 of coding's strata
# while coding is never capped, so the epoch-25 overshoot (terminal 36.5 %)
# unwinds as coding grows. `general` strata are the fold-assigned hashed
# buckets `general:<offset + sha256(task) % n>` per source (see the
# strata_offset table under "-- general --"), like math / tool_use.
# 2026-09-14 phase 9 (Jacob 23:25 UTC: "sample from the dataset more
# aggressively -- the model is already good on the previous states; put more
# of this data in"). Measured on 22 wvk-16/17 verdicts (27,994 paired turns):
# mean paired |d| coding 0.012 (41 % of turns king ~ challenger within
# 0.001), terminal 0.008 (48 %), tool_use 0.0075 (59 %, 34 % R-dead) vs
# king_fail 0.021, king_loop_onset 0.022, king_pivot 0.019, king_recoverable
# 0.019, completion_pre 0.018, completion 0.016, king_done 0.014,
# king_tooluse 0.012. The king-derived groups + completion move to ~32 % of
# the slice (was ~12 %) via [strata_budget] below; coding + terminal keep
# >= 40 % (they land at ~58 % because the king groups are supply-limited).
# Within the block the shares follow the measured deficit: the |d| >= 0.018
# groups draw 3 turns per task, king_done / king_tooluse / completion 2.
# 2026-09-16 phase 10 (Jacob 16:35 UTC, after the divergence analysis: "this
# could be heavily solved by sampling more from steps where the teacher stops
# but the king doesn't"). The stop-state classes -- king_done, king_tooluse,
# completion_pre, completion, king_divergence -- become the dominant king-
# derived mass: >= 25 % of every slice (16.8 % at epoch 44), taken from the
# coding / terminal teacher-trajectory turns (floor 40 % kept: buckets 6030 /
# 3700 -> 4000 / 2600), k = 3 sub-strata on every stop-state group.
coding = 0.28   # 0.36 -> 0.34 (king_coached) -> 0.28 (phase 10)
terminal = 0.18 # 0.22 -> 0.18 (phase 10)
nl2repo = 0.01
math = 0.02
tool_use = 0.02
# 2026-09-12 phase 5: + king_recoverable 0.02 out of king_fail (0.08 -> 0.06).
# 2026-09-13 (Jacob 06:40 + 07:08 UTC, docs/king-data-spec.md): king budget
# 0.15 in total, +0.02 from coding and terminal proportionally (0.44/0.27 ->
# 0.4276/0.2624), re-cut by state kind -- a blind upsample would amplify
# junk (60 % of king_fail draws were one-reply prompts or R-dead wiki
# loops; 447/710 onsets were later onsets of the same wreck): king_fail 0.02
# (agent multi-turn only, <= 8 turns per rollout), king_loop_onset 0.03
# (first onset per rollout), king_pivot 0.03, king_recoverable 0.04,
# king_done 0.03 (NEW: the king said/attempted "done" and kept going).
# Shares are caps; the supply-limited groups fill as king datagen and the
# side-table pipelines produce states.
# 2026-09-13 phase 7 (docs/improvement-loop.md P1 + P3): + king_tooluse 0.02
# (the king tool-calls where the teacher answers in prose; kind-by-teacher
# `text`), completion 0.03 -> 0.05, + completion_pre 0.01 (the 1-2 teacher
# turns before a solved stop). The 0.05 comes from coding and terminal
# proportionally (0.4276/0.2624 -> 0.3966/0.2434).
king_fail = 0.08   # 0.09 -> 0.08 (phase 10)
king_loop_onset = 0.04
king_pivot = 0.02
king_recoverable = 0.02
king_done = 0.03   # 0.01 -> 0.03 (phase 10, stop state)
king_tooluse = 0.03   # 0.02 -> 0.03 (phase 10, stop state); ~540 When2Call candidates/day + persist states from five tool feeders
completion = 0.12  # 0.10 -> 0.15 (phase 10) -> 0.12 (2026-09-20 auto-research quota: -0.03 to king_divergence; group sat at 18.7 %)
completion_pre = 0.02
general = 0.05
# 2026-09-15 (Jacob, lever 1/2): + king_coached 0.02 out of coding -- the
# teacher's hint-free continuations from coach-decisive king failure states
# (docs/coached-recovery.md). Small today (11 strict-decisive states / 24
# solved continuations), grows with the coach loop.
king_coached = 0.02
king_divergence = 0.06   # phase 10 0.03 -> 0.06 (2026-09-20 auto-research quota.json: 471 admit-ready turns behind the cap; the only king-derived group with fresh states for reigns 15-20)

# Per-source flag `interactive = true` (tau2-airline read, 2026-09-18): the
# harness talks to a simulated user mid-trajectory, so a teacher reply that
# is PROSE with no tool call ("Could you provide your user ID?") followed by
# more tool turns is a real, scorable turn. The fold admits those replies
# with kind `text` (ops/corpus_build.py INTERACTIVE_SOURCES); every other
# source keeps the final-reply-only text rule, so existing records do not
# change. Set it on the user-interactive sources when they land (e.g.
# `[source.affine_tau2_airline] interactive = true`).
[king_divergence]
# Phase 10 (Jacob 2026-09-16): the king's FIRST out-of-reference action --
# the step where the teacher's references stop or go elsewhere and the king
# keeps going its own way. Side-table from the improvement-loop worker
# (one JSON row per (rollout_id, turn_idx), `admit` true unless the row
# says otherwise) dropped into side_table_dir. Precedence: below king_done
# and king_recoverable, above king_tooluse / king_pivot / king_loop_onset;
# published rows of those lower groups are retired and readmitted here
# (readmit_published). Inherits [king_common] (leak rule waived, source
# excludes); teacher-probe gate applies; k = 3 sub-strata.
strata_buckets = 4000
side_table_dir = "affine/state/king_divergence"
readmit_published = true

[king_coached]
# Coached-teacher recovery (docs/coached-recovery.md; Jacob 2026-09-15,
# approved). What enters D: the TEACHER's hint-free continuation trajectory
# from a king failure state where the coach was decisive (rule =
# "hint_decisive": the envelope's privileged.origin.hint_decisive flag --
# coached teacher solved >= 1 of 3 continuations, plain teacher 0 of >= 2;
# "hint_decisive_strict" = coached majority; the thresholds are the
# fallback when the flag is absent). Envelopes (datagen schema + a top-level
# `privileged` block: origin state, the coach's per-turn notes, coach
# config) are dropped into envelopes_dir by the hint program; the fold
# strips `privileged` before deriving -- the notes never reach a prefix or a
# record (miners do not see hints). References at duel time are the
# ordinary fresh unhinted teacher refs; the teacher-probe gate applies.
# Stratum = king_coached:<sha256(king state id) % strata_buckets>, k = 3
# sub-strata via [strata_budget]. envelope_ids (optional file, one
# rollout_id per line) restricts to a hand-picked list.
strata_buckets = 4000
envelopes_dir = "affine/state/king_coached"
policy_prefix = ["coached_", "template_"]   # coach2 P2 template-coach envelopes carry template_<harness>
# 2026-09-15 19:58 UTC: the 3-draw hint-decisive label was ~2/3 noise (13 of
# 22 states recoverable by the plain teacher within 6 draws). Rule now
# plain_0_of_n: plain teacher 0 of >= min_plain_n draws AND coached solved
# >= min_coached_solved; the P1 verdict side-table (keep / demote / missing)
# overrides the envelope's own 3-draw counts; untestable states stay
# (keep_missing). Demoted states' published rows are retired.
rule = "plain_0_of_n"
min_plain_n = 6
min_coached_solved = 1
max_plain_solved = 0
keep_missing = true
verdict_table = "affine/state/king_coached/p1_verdict.json"
# envelope_ids = "affine/state/king_coached/envelope_ids.txt"

[curriculum]
# Adaptive, auditable curriculum (operator directive 2026-09-14 23:32 UTC,
# pre-approved 23:39 UTC; plan: docs/adaptive-curriculum-plan.md; fold hook
# spec internal/curriculum/hooks-for-fold.md). Rule v1:
#   w_s = (M~_s + eps)^gamma * S~_s   per stratum s of D
# M~ = the sitting king's miss rate on s (forfeit, or a live turn score under
# the bottom-quartile threshold theta), S~ = the live-reference rate (>= 2
# distinct teacher refs), both shrunk stratum -> cell -> group -> corpus with
# prior count n_0 over a ledger of every scored verdict since chal-00367
# (wvk 13) decayed with half_life_verdicts. Group share ∝ Σ w, floored
# (coding + terminal >= floor_coding_terminal; every group >= floor_frac_of_
# static × its [mix] share), capped at group_cap, moved at most max_share_
# shift per fold vs the live slice share; a stratum gets 1..m_max sub-strata
# by weight rank inside its group. Job: ops/curriculum/run.py (pm2
# `affine-curriculum`, 15:20 UTC daily, before the 16:00 UTC fold); outputs
# under https://data.affine.io/curriculum/.
# Fold side (ops/corpus_build.py load_curriculum): `mode` off = the fold
# ignores the vector; shadow = the fold logs the vector in the announce and
# stamps the manifest `curriculum` block (rule_version, mode, ledger_sha256,
# weights_sha256, manifest_sha256 = the manifest the weights were computed
# against) while [mix] above still decides; apply = the vector's shares
# become the group targets and its `m` the per-group sub-strata count (the
# phase-9 `<stratum>#k` interface). The fold reads the rule summed over
# SLICE KEYS (`share_raw_slice_keys`, decision 2026-09-15), falling back to
# `share_applied` / `share` / `share_shadow`. A missing, malformed, > 24 h
# old or mode-mismatched vector falls back to the static [mix] and says so.
# Kill switch = mode = "off". Stage 3 (apply) needs the seven-item criterion
# (plan §7.3) on two shadow folds; a fold counts only with >= min_new_verdicts
# new verdicts in the ledger. Data event, no scoring change, no wvk.
mode = "apply"   # curriculum apply fold 2026-09-17, weights 6b9643361e6a (mechanical, criterion passed twice)
weights_path = "ops/curriculum/out/groups.json"   # the fold's hook reads this (group vector + manifest block)
rule_version = 1
share_unit = "slice_keys"   # Σw over the phase-9 slice keys (operator 2026-09-15 00:39 UTC); base_strata = the plan's original sum, kept as share_raw_base_strata
counted_rule = "v2"   # Jacob's intent, coordinator decision 2026-09-16 17:04 UTC: v2 (divergence rule) counted; v1.2 stays published
auto_apply_on_pass = true   # the 15:20 UTC job flips mode -> apply when the decision table says APPLY (two counting shadow folds)
half_life_verdicts = 60
n_0 = 8
gamma = 1.0
eps = 0.02
theta_pct = 0.25
m_max = 3
floor_coding_terminal = 0.40
floor_frac_of_static = 0.5
group_cap = 0.60
max_share_shift = 0.05
min_new_verdicts = 10
recurrence_window_verdicts = 50
recurrence_group_cap = 0.18
recurrence_turn_cap = 0.20
counterfactual_verdicts = 20
near_king_z = 5.0
first_challenge = "chal-00367"
# Phase 10 (2026-09-16): the stop-state block (groups below) must keep at
# least stop_state_floor of the slice under any applied vector -- the rule
# (v1.2 counted, bc-e6baf26c) gives these groups an explicit stop-state
# deficit bonus; the fold rescales an applied vector up to the floor as the
# belt-and-braces (ops/corpus_build.py STOP_STATE_GROUPS).
stop_state_groups = ["king_done", "king_tooluse", "completion_pre", "completion", "king_divergence"]
stop_state_floor = 0.25
# MiMo item 3 (Jacob 2026-09-17 09:08 UTC): hard non-zero quotas, one place.
# Every `<name>_floor` + `<name>_groups` pair here is a published slice-share
# floor (ops/corpus_build.py load_floors): reported every fold
# (fold_stats.floors, manifest `floors`, announce), enforced by rescaling
# in curriculum apply mode; the static [mix] above and the strata budget
# are sized so the floors hold today. Values from the current supply and
# the MiMo reference (chat 3 %, general 12 % in an agentic run):
#   notool -- "do not act" states: the king called a tool where the teacher
#             answers / asks / refuses (king_tooluse, king_divergence;
#             When2Call feeds king_tooluse). 3.8 % today -> floor 3.5 %.
#   chat   -- prose-answer turns: the `general` group (QA / reasoning /
#             structured-output envs answered in prose or text). 5.9 %
#             today -> floor 6 % (general buckets 830 -> 900).
notool_groups = ["king_tooluse", "king_divergence"]
notool_floor = 0.035
chat_groups = ["general"]
chat_floor = 0.06
# 2026-09-20 (auto-research quota.json): king_divergence is the only king-
# derived group with fresh states for reigns 15-20 and 471 admit-ready turns
# sat behind its cap; the static share is 0.06 (from completion), and this
# floor carries it through the applied curriculum vector, which otherwise
# puts the group at ~1 %.
king_divergence_groups = ["king_divergence"]
king_divergence_floor = 0.06

[admission_gate]
# MiMo item 1 (Jacob 2026-09-17 09:08 UTC): two-sided gate on every king-
# derived group -- admit a state only if (a) the king failed there AND (b)
# the teacher recovers it. (b): state-level recoverable continuations
# (majority of >= 3 solved) where they exist, else task-level
# `task.teacher_solved` (envelope stamp, else any teacher_* rollout solved
# the task in the traces). Neither signal -> the state is HELD
# (`gate_unverified`), not admitted. Dead references (curriculum ledger:
# < 2 valid refs or all identical in a stored verdict) are dropped /
# retired. `apply_groups` = enforced; every other listed group is measured
# and reported (shadow) until the operator oks it. king_done is exempt from
# (a): "kept going after done" is the failure, whatever the grade.
enabled = true
groups = ["king_fail", "king_loop_onset", "king_pivot", "king_done", "king_tooluse", "king_divergence", "king_coached", "king_recoverable", "completion_pre"]
# 2026-09-17 dry run (epoch 45 index): enforced everywhere, only king_fail
# stays above its quota (1,526 -> 1,220 strata vs 993); king_divergence is
# unchanged (its side-table rows recover by construction). The other groups
# fall below quota (onset 644 -> 304, pivot 329 -> 101, tooluse 452 -> 303,
# completion_pre 322 -> 207, recoverable 208 -> 133, done 293 -> 226,
# coached 24 -> 15) and stay in shadow until the operator oks each.
apply_groups = ["king_fail", "king_divergence"]
# 2026-09-17 09:51 UTC decision: (a) the dead-reference drop applies to EVERY
# group above whatever its state; (b) the recovery rule stays shadow for the
# six starving groups and AUTO-PROMOTES: a group flips to enforced at the
# first fold where its post-gate strata >= its quota (mix share x total) and
# never flips back on its own (state.gate_enforced; published in the
# announce / manifest / fold_stats.yield.gate_state); (c) king_coached is
# exempt from the recovery rule -- the coached teacher is the recovery.
king_failed_exempt = ["king_done", "king_tooluse"]   # 2026-09-21: king_tooluse's selection IS the failure (tool where the teacher asks / answers), whatever the grade -- tau2-gen airline kings solve while still calling a tool at turn 1
recovery_exempt = ["king_coached"]
auto_promote = true
state_table_dir = "affine/state/recoverable"
majority_min_solved = 2
majority_min_continuations = 3
task_teacher_solved = true
dead_refs = true
ledger_dir = "affine/state/curriculum/ledger"
min_refs_valid = 2

[decontamination]
# Generated-benchmark sources: the fold refuses any task without the [GEN:...]
# marker and any task whose fingerprint (uid minus the tau2g-e<epoch>-<domain>-
# prefix and the [GEN:] suffix) is a tau2-bench `base` id of its domain
# (telecom ids are exactly such fingerprints; same intent + fault composition
# under any persona also counts). Airline / retail bench ids are bare numbers
# (no name overlap by construction) -- the marker is the guard there.
# Drop reasons: decontam_no_gen_marker, bench_panel_overlap.
[decontamination.affine_tau2_gen]
bench_ids = "rollouts/envs/affine_tau2_gen_v1/affine_tau2_gen_v1/data/e61/bench_task_ids.json"
require_gen_marker = true
domain_field = "repo"

[strata_budget]
# Phase 9 (2026-09-14). The duel slicer draws one turn per stratum uniformly
# over strata, so slice share = strata share. `buckets` merges a teacher-
# trajectory group into N fixed strata (`<group>:b<sha(original stratum) %
# N>`; no turn leaves D, each is drawn less often); `sub_strata` splits each
# task stratum of a supply-limited group into up to k sub-strata by turn
# (`<stratum>#<sha(turn_id) % k>` -- the curriculum interface, stable), so one duel may draw up to k turns of the
# same task. The original key stays in the index column `stratum_src`.
# RT-6 trade-off: a king task recurs across duels k times as often; fresh
# per-duel teacher references and block-hash-seeded slices remain the
# defense, and the fold announce logs the simulated per-duel recurrence.
# Sized so that king groups + completion ~ 32 % of strata with the supply
# at epoch 38 (coding + terminal ~ 58 %, general 5 %, tool_use 2 %).
enabled = true

[strata_budget.buckets]
coding = 3800     # 6030 -> 3800 (phase 10, 2026-09-16; sized so the stop-state block clears 25 %)
terminal = 2400   # 3700 -> 2400 (phase 10)
general = 900     # 830 -> 900 (2026-09-17, chat floor 6 %)
tool_use = 332

[strata_budget.sub_strata]
king_fail = 3
king_loop_onset = 3
king_pivot = 3
king_recoverable = 3
completion_pre = 3
king_coached = 3
king_divergence = 3   # phase 10
king_done = 3         # 2 -> 3 (phase 10)
king_tooluse = 3      # 2 -> 3 (phase 10)
completion = 3        # 2 -> 3 (phase 10)

[king_common]
# Rules every king_* group inherits (king-data spec §3.1, 2026-09-13).
# exclude_sources: unioned into each group's own list -- wiki / agent / math
# (phase 3, R-dead) + the one-reply `general` sources (the state is the task
# prompt; the teacher's own rollout already puts it in D). prolog and
# wikispeedia are multi-turn and stay admissible.
# one_reply_ok = false: a rollout with < 2 main-root replies never routes to
# a king group (`king_one_reply`).
# first_onset_only: one loop onset per rollout (`king_later_onset` dropped;
# later onsets are near-duplicate prefixes: first onsets recover 28 %, later
# 13 %). max_turns_per_rollout: king_fail keeps <= 8 turns per rollout --
# the labeler's escape turns first, then evenly over depth (`king_fail_cap`).
# retire_*: one-off index retirements of already-published rows (chunks and
# old manifests untouched, old verdicts replay) -- king_fail rows from
# excluded sources, king_loop_onset later-onset rows.
# kind_by_teacher: KNOB ONLY, NOT IMPLEMENTED -- stamping a king turn `text`
# when the teacher answers in prose changes which parser scores it; Jacob's
# call (spec §2.1 rule 3).
policy_prefix = "king_"
exclude_sources = ["affine_wiki", "affine_agent", "affine_math",
                   "affine_logic", "affine_trivia", "affine_ifeval", "affine_science",
                   "affine_unscramble", "affine_needle"]
one_reply_ok = false
first_onset_only = true
max_turns_per_rollout = 8
retire_excluded_published = true
retire_later_onsets = true
kind_by_teacher = false

[king_fail]
# The king's FAILED rollouts (policies king_*, rewards.solved == 0), any
# source, any dialect — one fold group so their slice share is a single
# dial. Bucketed strata `king_fail:NNNN` = sha256(instance_id) % buckets,
# a namespace of its own: the same repo's teacher rollouts live in
# `<repo>|<phase>` strata, and sharing those would add "within-stratum
# variety" and move no share (cap_fill). Sizing as for math: D holds
# ~10.2k strata (2026-09-10), so 10% of the slice ≈ 1,000 buckets;
# occupied buckets grow as failures land (300 failed tasks ≈ 260 buckets
# ≈ 2.5% of the slice). Re-derive UPWARD as D grows; never lower.
# Successful and unscored king rollouts are dropped at the fold
# (`king_not_failed` / `king_unscored` in the drop counts).
# 2026-09-12 (phase 3): wiki / agent / math king failures leave the seat --
# the teacher's references are identical there (centered R = 0), so the
# turns carried no signal; 83 % of king_fail's strata were such turns.
# Forward-only: turns already published under king_fail stay in D.
# 2026-09-12 (phase 4): buckets 1000 -> 2000 -- the 1,000-bucket ceiling
# (~8 % of the slice) binds before variance does (docs/duel-signal-by-group.md).
# New rollouts of a task whose sha256 % 2000 >= 1000 open a new bucket name
# above the old range; published strata keep theirs.
strata_buckets = 4000   # 2000 -> 4000 (2026-09-13, king groups re-cut; the bucket ceiling bound first)
policy_prefix = "king_"
exclude_sources = ["affine_wiki", "affine_agent", "affine_math"]

[king_loop_onset]
# The first turn of every LOOP in the king's failed rollouts (2026-09-11,
# operator directive; data event, no weight_version_key change). A loop:
# the king re-issues a command it already ran and gets the same
# observation back (affine/corpus/loops.py; 93 % of onsets are verbatim
# repeats). Measured 2026-09-11: 49-100 % of the king's failed agent
# rollouts loop (teacher 8-13 %), yet 1.1 % of king_fail turns were loop
# turns — a repeated command is a "reference leaked into the prefix" for
# the slicer, so 86 % of onsets never reached D. The fold waives THAT rule
# for onset turns only (the stored reference is never scored under
# min(R,G); teacher refs are sampled fresh at duel time); caps, dialect
# gate, panel and action-count rules still apply. Later turns of the same
# loop are dropped (king_in_loop: near-duplicate prefixes); the turns
# before / after a loop keep the king_fail path. Strata
# `king_loop_onset:NNNN` = sha256(instance_id) % buckets, own namespace as
# for king_fail; ~665 looping tasks in the first 36 h -> ~480 buckets
# occupied at 1000, ~1,000 onsets/day arrive at the current seat rate.
# exclude_sources: tool_use — the teacher's next tool call is
# near-deterministic there (centered R ~ 0, wvk-11 findings), so a wiki
# loop prefix carries no signal; those rollouts stay on king_fail.
strata_buckets = 4000   # 1000 -> 2000 (phase 4) -> 4000 (2026-09-13), see [king_fail]
policy_prefix = "king_"
exclude_sources = ["affine_wiki", "affine_agent", "affine_math"]   # + math 2026-09-12 (phase 3)

[king_pivot]
# The turns an LLM judge marked as the DECISION POINT of a failed king
# rollout (ops/king-review, PR #8; data plan §5, 2026-09-11). Rows come
# from the per-king side-tables under side_table_dir (`<digest>.jsonl`,
# one JSON line per (rollout_id, turn_idx), written by the review
# pipeline's labels_out.py); the fold reads every table there so earlier
# kings' pivots stay routable. Routed: `admit == true`, judge confidence
# >= min_confidence, failure_category not excluded. A turn that is both a
# pivot and a loop onset is a pivot (the judge's pivot is the earlier
# decision point on 67 % of looping rollouts). Leak rule waived as for
# king_loop_onset (a pivot that re-issues an earlier command is a "leak" by
# construction; the duel never echoes the stored reference). Strata
# `king_pivot:NNNN` = sha256(instance_id) % buckets. Forward-only: a pivot
# turn already published as king_fail keeps its turn_id and stays there
# (first table: 146 of 172 admitted pivots were already in D).
strata_buckets = 4000   # 1000 -> 2000 (phase 4) -> 4000 (2026-09-13), see [king_fail]
policy_prefix = "king_"
min_confidence = 0.7
side_table_dir = "affine/state/king_pivots"
exclude_categories = ["format_error"]
exclude_sources = ["affine_wiki", "affine_agent", "affine_math"]   # phase 3, 2026-09-12
# readmit_published (2026-09-12): the judge runs after the fold, so its
# pivots were already in D under king_fail. With this on, the fold retires
# those index rows (chunks / old manifests untouched, like the math
# retirement) and readmits the turns as king_pivot in the SAME run -- the
# rollouts' trace chunks must be in the run (--rederive-chunks); a turn not
# readmitted stays in king_fail. Pivots under king_loop_onset stay there.
readmit_published = true

[king_done]
# Done-blind states (king-data spec §2.2, 2026-09-13): the king's reply at
# turn k-1 was completion-eligible by the harness rule
# (affine/corpus/completion.py: `submit`, a finish tool call, Terminus
# task_complete, a prose report with no action) yet the rollout went on for
# >= min_more_turns more main-root replies. The routed state is turn k --
# the first turn where the king kept going instead of stopping and
# reporting; one per rollout. Highest precedence among the king groups and
# it reclaims such turns already published under king_fail. Leak rule
# waived like every king group. Strata king_done:NNNN.
strata_buckets = 4000
min_more_turns = 2
# kind: at a done state the teacher stops -- a prose report or a finish
# tool call; `text` parses both (Jacob 2026-09-13).
kind = "text"
# 2026-09-13 phase 7 (P1): affine_agent and wikispeedia states feed this
# group again (73 turns were waiting against a 3 % cap; affine_agent king
# rollouts hit the loop guard 79 % of the time).
lift_exclude = ["affine_agent", "affine_wikispeedia"]

[king_tooluse]
# Improvement loop P1 (BFCL irrelevance: the king calls a tool on 95 % of
# prompts where none applies). Jacob 2026-09-13 14:58 UTC: route by the
# KING's behaviour -- the points where the king failed -- not by what the
# teacher did. Selection:
#   (a) one-shot: on a prose-answer prompt set served with tool schemas
#       (prose_sources -- the datagen worker's P1 source; append its name
#       when it lands, its records route by the king_ policy prefix), the
#       king's first reply is a tool call -> the king's turn 0;
#   (b) persist: on a tool source (tool_sources), the king repeats the same
#       tool call after an error / empty / nudge observation -> that turn
#       (affine/corpus/loops.py `persist`).
# kind: the duel-time action_kind of these turns. `text` parses a whole
# visible reply, tool XML included, so the teacher's references stay
# parseable whether the teacher answers in prose or calls a tool; under
# `tool_call` a prose reference drops and zeroes the group. `text` has been
# an admitted dialect since wvk 13 -- a routing decision, not a contract
# change. One-reply rollouts allowed (the prompt-with-tools IS the state);
# the common exclusions are not inherited (they exclude these sources).
strata_buckets = 4000   # 2000 -> 4000 (2026-09-14 phase 9b: When2Call + tool-feeder persist supply)
inherit_exclude = false
one_reply_ok = true
prose_sources = ["affine_when2call", "affine_notool",
                 "affine_tau2", "affine_tau2_gen"]   # + tau2-gen (2026-09-21): airline / telecom customers state the problem, not the id, on turn 1; retail openers carry an order id -> skipped via prose_skip_repos   # NOT affine_tau2_synth: there the customer often opens with their name / id and the teacher's turn-1 lookup is legitimate (13/24 in the probe), so a king turn-1 call is not a failure by itself; synth relies on the persist rule + king_divergence   # datagen P1 sources (2026-09-14); when2call rows carry repo = when2call/<label> -- only request_for_info / cannot_answer items are no-tool prompts; affine_tau2 (2026-09-18): the king opens with a tool call where the teacher asks the customer (turn 1, 24/24 in the probe)
tool_sources = ["affine_agent", "affine_wikispeedia", "affine_sql", "affine_eog", "affine_autobench",
                "affine_tau2", "affine_tau2_synth", "affine_tau2_gen"]   # + τ² telecom (2026-09-17): the king re-calls get_customer_by_phone with invented numbers after every error
# When2Call stamps repo = when2call/<label>; on tool_call items the king's
# first-reply call is correct, so rule (a) skips them (route only the
# request_for_info / cannot_answer rows where the king called a tool).
prose_skip_repos = ["when2call/tool_call", "tau2-gen/retail"]   # tau2-gen retail: the opener often gives an order id, a turn-1 lookup is legitimate
kind = "text"

[king_recoverable]
# Phase 5 (2026-09-12, docs/teacher-recoverable-filter.md): failure states
# of the king that the TEACHER recovers from. ops/recoverable (PR #13)
# replays the king's prefix in a fresh container and lets the teacher
# continue; a state is admitted when the teacher solved the task from
# there AND its first action differs from the king's. Any state kind (loop
# onset, pivot). Teacher recovery is only 23-28 % on agent harnesses, so
# this is a GROUP, not a filter: king_loop_onset / king_pivot keep every
# state, and a state admitted here leaves them (recoverable wins). Rows
# from `<digest>.jsonl` under side_table_dir (written by the recoverable
# pipeline). Leak rule waived like the other king groups. Strata
# `king_recoverable:NNNN` = sha256(instance_id) % buckets. readmit_published:
# states already in D under king_fail / king_loop_onset / king_pivot are
# retired there and readmitted here in the same run (chunks untouched).
# exclude_sources as for every king group (phase 3): the side-table is 88 %
# wiki states (534 of 607 admits) -- drop the exclusion to let them in.
strata_buckets = 4000   # 2000 -> 4000 (2026-09-13, king groups re-cut; the bucket ceiling bound first)
policy_prefix = "king_"
side_table_dir = "affine/state/recoverable"
exclude_sources = ["affine_wiki", "affine_agent", "affine_math"]
readmit_published = true

[completion_pre]
# Improvement loop P3 (premature finish: 6 % of king failures, Terminus
# 29 %). King-selected (Jacob 2026-09-13): the king finished on its own
# (`agent_completed`, final reply completion-eligible by the harness rule)
# and the env graded the rollout FAILED. The routed states are the n_before
# turns right before that final reply -- where the king should have
# verified (run the tests, check the diff) instead of finishing. kind
# `text` so a teacher that verifies with a tool and one that finishes in
# prose both parse. A king group: leak rule waived, common exclusions
# inherited. Strata completion_pre:NNNN.
strata_buckets = 4000
n_before = 2
kind = "text"

[completion]
# The reply that ENDED a solved rollout on purpose — teacher and king
# alike (data plan §6, 2026-09-11): stop_condition agent_completed,
# outcome solved, final reply satisfying the per-harness rule in
# affine/corpus/completion.py (mini-swe `submit`, a finish tool call, a
# final visible `text` report, Terminus task_complete, \boxed{}).
# Reasoning-only finishes carry no visible text and match nothing. That
# final turn moves out of its source group into `completion:NNNN` =
# sha256(instance_id) % buckets; the rollout's other turns are untouched.
# leak_exempt = false: a final reply is expected to be new text. The fold
# logs `completion_leaked` (candidates the leak rule refused) so the
# assumption is measured; mini-swe's COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT
# command is quoted in the task prompt and IS a leak by the rule.
# min_replies = 2: a one-reply rollout (math, single-shot answer envs) has
# no "decide to stop" state -- its only turn is the answer -- and routing
# it would drain the source group's growth into this one. Sources whose
# fold-mix share is 0 (general, until set) are excluded by the fold too.
strata_buckets = 4000   # 1000 -> 4000 (2026-09-14 phase 9b: 972 of 1000 buckets were occupied; supply must not cap while the share rises)
exclude_sources = ["affine_wiki"]
leak_exempt = false
min_replies = 2

[math_filter]
# Math re-source (phase 3, 2026-09-12; docs/duel-signal-by-group.md). Math
# is 92 % dead on the R leg: the teacher boxes the same answer on 75 % of
# its turns, so its k = 3 references are identical and centered R = 0; the
# 8 % where it disagrees with itself carry R = 0.145/byte, 15x a coding
# turn. The fold cannot see duel-time references, so it uses the traces as
# a PROXY: a problem is kept when the teacher's datagen rollouts on it show
# disagreement (>= 2 distinct normalized \boxed{} strings across its
# samples, or the teacher failed it at least once) or the king failed it.
# Deterministic problems: new candidates are dropped (`math_deterministic`)
# and, with retire_published, their already-published turns are removed
# from the INDEX at the next revision (chunk objects and old manifests are
# untouched, so past verdicts replay). If fewer than min_surviving_strata
# strata would survive, the fold keeps the old pool at the [mix] share.
enabled = true
# 2026-09-13: + affine_i3math (wave 2/3, group math). The same proxy applies
# to every source of the math group: a problem the teacher answers
# deterministically is R-dead whatever the pool it came from.
sources = ["affine_math", "affine_i3math"]
retire_published = true
min_surviving_strata = 100
# P4 (2026-09-14): 47 % of math strata were dead -- the teacher hits the
# 1,792-token duel cap. Keep a problem only if >= 2 of the teacher's datagen
# samples boxed an answer within ~1,792 tokens (cap_chars ~ 4 chars/token,
# thought + answer). No new inference.
min_boxed_within_cap = 2
cap_chars = 7000

# Language targets for NEWLY FOLDED coding turns (2026-09-01). Enforced by
# ops/datagen_refresh.py as a second waterfill (after the group waterfill)
# keyed by rec["language"], with cumulative counts in state["lang_counts"].
# Existing corpus turns are never rebalanced. Tag → bucket aliasing lives in
# the fold script: rust→rs, js/ts/typescript/javascript→tsjs, cpp/c→rs,
# php→tsjs, missing/unknown→python.
# 2026-09-12 (phase 4): these targets are HARD only while coding is at or
# above its group target. Below it (coding's supply ratio under terminal's,
# the group stage's own test) the fold admits every language, python
# included, under a per-language ceiling of 55 % of coding's strata (0.45
# -> 0.55, operator decision 2026-09-12; diversity comes from non-python
# supply, not the fold) and a
# per-fold budget of 4.5 share points (ops/corpus_build.py
# LANG_SOFT_CEILING / CATCHUP_SHIFT_BUDGET). The hard cap had frozen python
# at 0.25/0.20 x go's supply and starved coding (epoch 26: 0 of 4,139
# coding rollouts kept).
[teacher_probe]
# Improvement loop P4 (2026-09-14): "can the teacher answer here?" A turn
# of a gated group enters D only with a probe row in the side-table
# (ops/teacher_probe/probe.py: 3 teacher samples at the prefix, T 0.8,
# 1,792 tokens, the turn's dialect parser) showing >= min_valid parsed
# actions that are not all identical (identical refs = R == 0). Turns
# without a row are held (record deferred, turn written to `pending` for
# the probe job); failing turns drop (`probe_failed`); published rows of
# the gated groups whose probe fails are retired once
# (retire_failed_published). Measured before the gate: ~25 % of king-group
# strata dead (onset 29 %, pivot 26 %, king_fail 24 %, recoverable 17 %,
# done 12 %; Claude Code states 61 %). NOT a prefix-length cap and NOT a
# band filter (both measured useless). The probe runs on Engy's copy of the
# teacher, never on the duel pods' swarm.
enabled = true
side_table = "affine/state/teacher_probe/probes.jsonl"
pending = "affine/state/teacher_probe/pending.jsonl"
groups = ["king_fail", "king_done", "king_recoverable", "king_tooluse", "king_pivot", "king_loop_onset", "completion_pre", "king_coached", "king_divergence"]
min_valid = 2
require_distinct = true
# Jacob's rule (2026-09-14): when >= min_valid teacher samples are prose with
# no action in the turn's dialect (the teacher answers / says "done" where
# the king repeated a tool call), admit the turn with kind `text` instead of
# dropping it; a published row is re-published with the new kind.
restamp_text = true
retire_failed_published = true

[lang_mix.coding]
python = 0.25
go = 0.20
java = 0.20
rs = 0.20
tsjs = 0.15

[defaults]
# Policy ids from policies.toml; sources may override with `policies = [...]`.
# Scheduler picks by per-policy kept-turn deficit (equal shares here, so
# the three harnesses split new turns evenly).
# 2026-09-02: teacher-only. The GLM seat (glm_* policies, still defined in
# policies.toml) is switched off by operator decision — every new prefix is
# the duel teacher's own history, so duel-time refs stay on-policy.
# 2026-09-07: + teacher_claude_code (IDE-agent prompt family; verifiers'
# claude_code harness). Datagen-pod probe on 2 terminal-bench-2 tasks:
# 26 replies -> 16 tool_call turns, 0 drops, baked parity held, dialect
# marker present, prefixes 88-107k chars (Claude Code's 80k-char system
# prompt + tool schemas; under the 120k slicer cap). teacher_codex stays
# staged: Codex sends two leading system messages the teacher template
# cannot render (see policies.toml).
# 2026-09-10: + the king seat (king_* in policies.toml, share 1.0 vs the
# teacher's 2.0). Idle until the controller has served the current king.
# 2026-09-10 (evening, operator: data broad enough for "a really good
# agent" — Claude Code, Hermes, the terminal-bench agent, ...): + kimi_code,
# hermes_agent and terminus_2 harnesses, teacher + king each. Datagen-pod
# probes with the KING on terminal-bench-2 tasks (2 each, 12-40 turns):
#   kimi_code   27 tool_call turns kept / 0 drops, prefixes 94-126k chars
#               (Kimi's system prompt; under the 300k slicer cap).
#   terminus_2  29 terminus_json turns kept / 0 drops, one task SOLVED by
#               the king, replies are the bare JSON object. Dialect
#               REGISTERED, NOT ADMITTED: turns stage behind
#               [dataset].allowed_action_kinds until the operator's fork
#               decision (the fold reports action_kind_not_admitted).
#   hermes_agent tool_call, one call per reply (see policies.toml); probe
#               yield below.
# Seats (scheduler.py): the king replays tasks the teacher has finished,
# so terminal / math / tool_use / nl2repo pools exhausted by the teacher
# are open to the king — before, king failures came from 3 coding sources.
policies = ["teacher_textbased", "teacher_bashtool", "teacher_pi", "teacher_claude_code",
            "teacher_kimi", "teacher_hermes", "teacher_terminus",
            "king_textbased", "king_bashtool", "king_pi", "king_claude_code",
            "king_kimi", "king_hermes", "king_terminus",
            "king_textbased_greedy", "king_bashtool_greedy",
            "king_pi_greedy", "king_claude_code_greedy", "king_kimi_greedy",
            "king_hermes_greedy", "king_terminus_greedy"]

