# Source registry: every task source is one declarative block.
# Adding a source = adding one block (+ a catalog builder if its kind is new).
#
# [mix] targets are shares of KEPT TURNS (records that survive the
# duel_turns view + prefilter) per group — not attempts. The scheduler
# steers generation toward these; ops/datagen_refresh.py enforces the same
# targets at fold time.

[mix]
coding = 0.60
terminal = 0.30
nl2repo = 0.10

# Language targets for NEWLY FOLDED coding turns (2026-09-01). Enforced by
# ops/datagen_refresh.py as a second waterfill (after the group waterfill)
# keyed by rec["language"], with cumulative counts in state["lang_counts"].
# Existing corpus turns are never rebalanced. Tag → bucket aliasing lives in
# the fold script: rust→rs, js/ts/typescript/javascript→tsjs, cpp/c→rs,
# php→tsjs, missing/unknown→python.
[lang_mix.coding]
python = 0.25
go = 0.20
java = 0.20
rs = 0.20
tsjs = 0.15

[defaults]
# Policy ids from policies.toml; sources may override with `policies = [...]`.
policies = ["glm_textbased"]

# -- coding --------------------------------------------------------------------

[source.swerebench_main]
# The former main datagen loop (mini-swe-agent on the nebius pool).
# Retired 2026-09-01 (share 0): old Python-only dump whose 97 repos overlap
# the 860-task exam — the block stays so source → group mapping keeps
# resolving for already-staged records.
group = "coding"
runner = "mini_swe"
catalog = "hf_swebench"
dataset = "nebius/SWE-rebench"
split = "filtered"
swe_eval = true          # swebench verdict as rewards.solved telemetry
share = 0.0

[source.scaleswe]
group = "coding"
runner = "verifiers"
taskset_id = "scaleswe-v1"
catalog = "hf"
dataset = "PrimeIntellect/Scale-SWE-Verified"
split = "train"
row_meta = "scaleswe"
share = 3.0
# Catalog + pull failures already cover availability; the taskset's own
# docker-hub tag enumeration costs ~17 registry calls per batch.
extra_flags = ["--env.taskset.filter-unavailable-images", "False"]

[source.swerebench_v2]
group = "coding"
runner = "verifiers"
taskset_id = "swerebench-v2-full"
catalog = "hf"
dataset = "PrimeIntellect/SWE-rebench-V2"
split = "train"
row_meta = "swerebench_v2"
share = 2.0

[source.r2e_gym]
group = "coding"
runner = "verifiers"
taskset_id = "r2e-gym-v1"
catalog = "hf"
dataset = "PrimeIntellect/R2E-Gym-Subset-Verified"
split = "train"
uid_field = "commit_hash"
row_meta = "r2e"
share = 1.0

[source.multiswe]
group = "coding"
runner = "verifiers"
taskset_id = "multiswe-v1"
catalog = "hf"
dataset = "PrimeIntellect/Multi-SWE-RL-Verified"
split = "train"
row_meta = "multiswe"
# 1.0 → 3.0 (2026-09-01): absorb the retired swerebench_main share with the
# multilingual repo-bugfix source closest to the official board's task style.
share = 3.0

[source.swesmith]
group = "coding"
runner = "verifiers"
taskset_id = "swesmith-v1"
catalog = "swesmith"        # multi-language HF shards + per-repo cap
pass_dataset = false
share = 4.0

[source.swelego]
group = "coding"
runner = "verifiers"
taskset_id = "swelego-v1"
catalog = "hf"
dataset = "PrimeIntellect/SWE-Lego-Real-Data-Verified"
split = "resolved"
row_meta = "swelego"
share = 2.0

# -- terminal ------------------------------------------------------------------

[source.terminal_lego]
group = "terminal"
runner = "verifiers"
taskset_id = "terminal-lego-v1"
catalog = "terminal_lego"   # HF git checkout + task.toml scan
select = "tasks"
pass_dataset = false
local_docker_build = true
share = 3.0

[source.terminal_bench_2]
group = "terminal"
runner = "verifiers"
taskset_id = "terminal-bench-2-v1"
catalog = "terminal_bench_2"
select = "tasks"
pass_dataset = false
task_id_basename = true     # harbor filters on the task dir basename
share = 1.0

# -- nl2repo -------------------------------------------------------------------

[source.nl2repobench]
group = "nl2repo"
runner = "verifiers"
taskset_id = "nl2repobench-v1"
catalog = "nl2repobench"    # bundled test_files scan
select = "tasks"
pass_dataset = false
share = 1.0
