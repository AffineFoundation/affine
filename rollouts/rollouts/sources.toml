# Source registry: every task source is one declarative block.
# Adding a source = adding one block (+ a catalog builder if its kind is new).
#
# [mix] targets are shares of KEPT TURNS (records that survive the
# duel_turns view + prefilter) per group — not attempts. The scheduler
# steers generation toward these; ops/datagen_refresh.py enforces the same
# targets at fold time.

[mix]
# ONE table for generation (rollouts scheduler: deficit per source-backed
# group) and for the fold (ops/corpus_build.py: slice-strata shares
# enforced by cap_fill). The [fold_mix] override existed 2026-09-11 only
# to hold `general` at 0.0 while its sources built a backlog; phase 3
# (2026-09-12) sets general = 0.05 and folds the two tables back into one.
# Groups without a source (king_*, completion) are fold-routed; the
# scheduler ignores them.
#
# History: 2026-09-01 math + tool_use generated ahead of the wvk-11 fork;
# 2026-09-10 + king_fail 0.10; 2026-09-11 king_fail 0.07 + king_loop_onset
# 0.03, then + king_pivot 0.02 (out of king_fail) and completion 0.03 (out
# of coding / terminal / math); env wave 1 + general.
#
# 2026-09-12 phase 3 (docs/duel-signal-by-group.md, 52 verdicts joined to
# the view index): coding and terminal carry 87 % of the paired variance
# and terminal has the best signal per slot; math is 92 % R-dead (teacher
# refs identical -> centered R = 0) and tool_use 58 %; king_fail's strata
# were 83 % wiki + math king failures. Operator vector (addendum, general
# 0.05 taken from tool_use): coding 0.44 / terminal 0.27 / king_fail 0.08 /
# king_loop_onset 0.03 / king_pivot 0.02 / completion 0.03 / nl2repo 0.03 /
# math 0.03 / tool_use 0.02 / general 0.05. cap_fill's anchor rule (target
# >= 0.1: coding, terminal) holds terminal to 0.27/0.44 of coding's strata
# while coding is never capped, so the epoch-25 overshoot (terminal 36.5 %)
# unwinds as coding grows. `general` strata are the fold-assigned hashed
# buckets `general:<offset + sha256(task) % n>` per source (see the
# strata_offset table under "-- general --"), like math / tool_use.
coding = 0.44
terminal = 0.27
nl2repo = 0.03
math = 0.03
tool_use = 0.02
king_fail = 0.08
king_loop_onset = 0.03
king_pivot = 0.02
completion = 0.03
general = 0.05

[king_fail]
# The king's FAILED rollouts (policies king_*, rewards.solved == 0), any
# source, any dialect — one fold group so their slice share is a single
# dial. Bucketed strata `king_fail:NNNN` = sha256(instance_id) % buckets,
# a namespace of its own: the same repo's teacher rollouts live in
# `<repo>|<phase>` strata, and sharing those would add "within-stratum
# variety" and move no share (cap_fill). Sizing as for math: D holds
# ~10.2k strata (2026-09-10), so 10% of the slice ≈ 1,000 buckets;
# occupied buckets grow as failures land (300 failed tasks ≈ 260 buckets
# ≈ 2.5% of the slice). Re-derive UPWARD as D grows; never lower.
# Successful and unscored king rollouts are dropped at the fold
# (`king_not_failed` / `king_unscored` in the drop counts).
# 2026-09-12 (phase 3): wiki / agent / math king failures leave the seat --
# the teacher's references are identical there (centered R = 0), so the
# turns carried no signal; 83 % of king_fail's strata were such turns.
# Forward-only: turns already published under king_fail stay in D.
# 2026-09-12 (phase 4): buckets 1000 -> 2000 -- the 1,000-bucket ceiling
# (~8 % of the slice) binds before variance does (docs/duel-signal-by-group.md).
# New rollouts of a task whose sha256 % 2000 >= 1000 open a new bucket name
# above the old range; published strata keep theirs.
strata_buckets = 2000
policy_prefix = "king_"
exclude_sources = ["affine_wiki", "affine_agent", "affine_math"]

[king_loop_onset]
# The first turn of every LOOP in the king's failed rollouts (2026-09-11,
# operator directive; data event, no weight_version_key change). A loop:
# the king re-issues a command it already ran and gets the same
# observation back (affine/corpus/loops.py; 93 % of onsets are verbatim
# repeats). Measured 2026-09-11: 49-100 % of the king's failed agent
# rollouts loop (teacher 8-13 %), yet 1.1 % of king_fail turns were loop
# turns — a repeated command is a "reference leaked into the prefix" for
# the slicer, so 86 % of onsets never reached D. The fold waives THAT rule
# for onset turns only (the stored reference is never scored under
# min(R,G); teacher refs are sampled fresh at duel time); caps, dialect
# gate, panel and action-count rules still apply. Later turns of the same
# loop are dropped (king_in_loop: near-duplicate prefixes); the turns
# before / after a loop keep the king_fail path. Strata
# `king_loop_onset:NNNN` = sha256(instance_id) % buckets, own namespace as
# for king_fail; ~665 looping tasks in the first 36 h -> ~480 buckets
# occupied at 1000, ~1,000 onsets/day arrive at the current seat rate.
# exclude_sources: tool_use — the teacher's next tool call is
# near-deterministic there (centered R ~ 0, wvk-11 findings), so a wiki
# loop prefix carries no signal; those rollouts stay on king_fail.
strata_buckets = 2000   # 1000 -> 2000, phase 4 (2026-09-12), see [king_fail]
policy_prefix = "king_"
exclude_sources = ["affine_wiki", "affine_agent", "affine_math"]   # + math 2026-09-12 (phase 3)

[king_pivot]
# The turns an LLM judge marked as the DECISION POINT of a failed king
# rollout (ops/king-review, PR #8; data plan §5, 2026-09-11). Rows come
# from the per-king side-tables under side_table_dir (`<digest>.jsonl`,
# one JSON line per (rollout_id, turn_idx), written by the review
# pipeline's labels_out.py); the fold reads every table there so earlier
# kings' pivots stay routable. Routed: `admit == true`, judge confidence
# >= min_confidence, failure_category not excluded. A turn that is both a
# pivot and a loop onset is a pivot (the judge's pivot is the earlier
# decision point on 67 % of looping rollouts). Leak rule waived as for
# king_loop_onset (a pivot that re-issues an earlier command is a "leak" by
# construction; the duel never echoes the stored reference). Strata
# `king_pivot:NNNN` = sha256(instance_id) % buckets. Forward-only: a pivot
# turn already published as king_fail keeps its turn_id and stays there
# (first table: 146 of 172 admitted pivots were already in D).
strata_buckets = 2000   # 1000 -> 2000, phase 4 (2026-09-12), see [king_fail]
policy_prefix = "king_"
min_confidence = 0.7
side_table_dir = "affine/state/king_pivots"
exclude_categories = ["format_error"]
exclude_sources = ["affine_wiki", "affine_agent", "affine_math"]   # phase 3, 2026-09-12

[completion]
# The reply that ENDED a solved rollout on purpose — teacher and king
# alike (data plan §6, 2026-09-11): stop_condition agent_completed,
# outcome solved, final reply satisfying the per-harness rule in
# affine/corpus/completion.py (mini-swe `submit`, a finish tool call, a
# final visible `text` report, Terminus task_complete, \boxed{}).
# Reasoning-only finishes carry no visible text and match nothing. That
# final turn moves out of its source group into `completion:NNNN` =
# sha256(instance_id) % buckets; the rollout's other turns are untouched.
# leak_exempt = false: a final reply is expected to be new text. The fold
# logs `completion_leaked` (candidates the leak rule refused) so the
# assumption is measured; mini-swe's COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT
# command is quoted in the task prompt and IS a leak by the rule.
# min_replies = 2: a one-reply rollout (math, single-shot answer envs) has
# no "decide to stop" state -- its only turn is the answer -- and routing
# it would drain the source group's growth into this one. Sources whose
# fold-mix share is 0 (general, until set) are excluded by the fold too.
strata_buckets = 1000
exclude_sources = ["affine_wiki"]
leak_exempt = false
min_replies = 2

[math_filter]
# Math re-source (phase 3, 2026-09-12; docs/duel-signal-by-group.md). Math
# is 92 % dead on the R leg: the teacher boxes the same answer on 75 % of
# its turns, so its k = 3 references are identical and centered R = 0; the
# 8 % where it disagrees with itself carry R = 0.145/byte, 15x a coding
# turn. The fold cannot see duel-time references, so it uses the traces as
# a PROXY: a problem is kept when the teacher's datagen rollouts on it show
# disagreement (>= 2 distinct normalized \boxed{} strings across its
# samples, or the teacher failed it at least once) or the king failed it.
# Deterministic problems: new candidates are dropped (`math_deterministic`)
# and, with retire_published, their already-published turns are removed
# from the INDEX at the next revision (chunk objects and old manifests are
# untouched, so past verdicts replay). If fewer than min_surviving_strata
# strata would survive, the fold keeps the old pool at the [mix] share.
enabled = true
source = "affine_math"
retire_published = true
min_surviving_strata = 100

# Language targets for NEWLY FOLDED coding turns (2026-09-01). Enforced by
# ops/datagen_refresh.py as a second waterfill (after the group waterfill)
# keyed by rec["language"], with cumulative counts in state["lang_counts"].
# Existing corpus turns are never rebalanced. Tag → bucket aliasing lives in
# the fold script: rust→rs, js/ts/typescript/javascript→tsjs, cpp/c→rs,
# php→tsjs, missing/unknown→python.
# 2026-09-12 (phase 4): these targets are HARD only while coding is at or
# above its group target. Below it (coding's supply ratio under terminal's,
# the group stage's own test) the fold admits every language, python
# included, under a per-language ceiling of 55 % of coding's strata (0.45
# -> 0.55, operator decision 2026-09-12; diversity comes from non-python
# supply, not the fold) and a
# per-fold budget of 4.5 share points (ops/corpus_build.py
# LANG_SOFT_CEILING / CATCHUP_SHIFT_BUDGET). The hard cap had frozen python
# at 0.25/0.20 x go's supply and starved coding (epoch 26: 0 of 4,139
# coding rollouts kept).
[lang_mix.coding]
python = 0.25
go = 0.20
java = 0.20
rs = 0.20
tsjs = 0.15

[defaults]
# Policy ids from policies.toml; sources may override with `policies = [...]`.
# Scheduler picks by per-policy kept-turn deficit (equal shares here, so
# the three harnesses split new turns evenly).
# 2026-09-02: teacher-only. The GLM seat (glm_* policies, still defined in
# policies.toml) is switched off by operator decision — every new prefix is
# the duel teacher's own history, so duel-time refs stay on-policy.
# 2026-09-07: + teacher_claude_code (IDE-agent prompt family; verifiers'
# claude_code harness). Datagen-pod probe on 2 terminal-bench-2 tasks:
# 26 replies -> 16 tool_call turns, 0 drops, baked parity held, dialect
# marker present, prefixes 88-107k chars (Claude Code's 80k-char system
# prompt + tool schemas; under the 120k slicer cap). teacher_codex stays
# staged: Codex sends two leading system messages the teacher template
# cannot render (see policies.toml).
# 2026-09-10: + the king seat (king_* in policies.toml, share 1.0 vs the
# teacher's 2.0). Idle until the controller has served the current king.
# 2026-09-10 (evening, operator: data broad enough for "a really good
# agent" — Claude Code, Hermes, the terminal-bench agent, ...): + kimi_code,
# hermes_agent and terminus_2 harnesses, teacher + king each. Datagen-pod
# probes with the KING on terminal-bench-2 tasks (2 each, 12-40 turns):
#   kimi_code   27 tool_call turns kept / 0 drops, prefixes 94-126k chars
#               (Kimi's system prompt; under the 300k slicer cap).
#   terminus_2  29 terminus_json turns kept / 0 drops, one task SOLVED by
#               the king, replies are the bare JSON object. Dialect
#               REGISTERED, NOT ADMITTED: turns stage behind
#               [dataset].allowed_action_kinds until the operator's fork
#               decision (the fold reports action_kind_not_admitted).
#   hermes_agent tool_call, one call per reply (see policies.toml); probe
#               yield below.
# Seats (scheduler.py): the king replays tasks the teacher has finished,
# so terminal / math / tool_use / nl2repo pools exhausted by the teacher
# are open to the king — before, king failures came from 3 coding sources.
policies = ["teacher_textbased", "teacher_bashtool", "teacher_pi",
            "teacher_claude_code", "teacher_kimi", "teacher_hermes",
            "teacher_terminus",
            "king_textbased", "king_bashtool", "king_pi", "king_claude_code",
            "king_kimi", "king_hermes", "king_terminus"]

