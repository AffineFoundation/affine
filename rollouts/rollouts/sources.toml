# τ²-bench telecom with an LLM USER SIMULATOR (env wave 4, 2026-09-17/18;
# Jacob's standing directive on king failure classes + Alan's τ² note +
# docs/tau2-airline-failures.md: the king's thought says "ask the user", its
# action calls a tool with an invented argument - 1,140 / 1,140 telecom
# tool-call nodes, 45-47 / 50 airline tasks dead at TURN 1 with the schema's
# example id `sara_doe_496`; D had no state where the teacher has anyone to
# ask). rollouts/envs/affine_tau2_v1 = taskset + harness over prime-envs
# tau2_bench_v1: τ²'s own orchestrator runs as a subprocess (no container),
# the AGENT is the policy's model through the interception endpoint, the
# CUSTOMER is DeepSeek V4.1 Flash on Engy at T 0 (`--env.agent.harness.
# user-model` to change), the domain tools mutate a database and Sierra's
# evaluation grades the final state + required communication -> `solved`.
# The telecom tool schemas get airline-style EXAMPLE VALUES on their
# identifier parameters ("such as '555-123-4567'", 'C1234', 'L5678'; the
# harness patches the docstrings before the tools are built) - the bait the
# kings fall for; do not sanitise them away (`example-values false` = upstream).
# POOL = telecom `full` \ `base` = 2,171 generated tasks. `base` (114) is what
# the benchsuite runs as tau2-telecom; τ²'s `train` split is inside `base`;
# airline / retail `base` = every task of those domains -> not offered.
# Overlap check at τ² revision 337326e: full 2,285 ∩ base 114 = 114 -> 2,171
# disjoint.
# interactive = true: the fold admits the agent's mid-trajectory prose
# replies (the message to the customer, followed by the customer's answer)
# as `text` turns - the "ask" states. Probe 2026-09-17/18 (datagen-2, 24 + 24
# + 2): teacher 17/26 solved, 26/26 turn-1 replies prose ("I'll need your
# phone number"), 295 prose / 470 replies (0.63), 0 invented phone numbers;
# king (reign 13) 0/24, 0 messages to the customer in 221 replies, 24/24
# turn-1 tool calls with an invented or '?' phone number, 221/221 tool-call
# thoughts say "ask the user". Fold simulation with the interactive rule:
# teacher 460 turns / 26 rollouts (314 text incl. 26 turn-1 + 288 deeper
# asks, 146 tool_call, 7 prose dropped by leak/format); king turn-1 ->
# king_tooluse one-shot 24/24 (prose_sources), repeats -> persist
# (tool_sources). tool_use buckets 1430-1659 (when2call owns 1200-1429).
