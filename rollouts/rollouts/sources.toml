# tasks from the PUBLIC PrimeIntellect-ai/prime-tasks repo, each with its
# Dockerfile context. The upstream taskset pins Prime-internal images that
# only Prime sandboxes can pull; the pod builds each task image itself
# (local_docker_build, terminal_lego's path) under the declared tag - tasks
# of one base_image share the apt layer via the build cache. Harbor
# verifier -> `solved`. Share 1.0 next to terminal_lego 3.0 / tb2 1.0.
