taskset_id = "affine-wiki-v1"       # rollouts/envs/affine_wiki_v1
catalog = "hf"
dataset = "willcb/wiki-trivia-questions-v4"
split = "train"
row_meta = "wiki_trivia"
select = "tasks"
pass_dataset = false
policies = ["teacher_toolcall"]        # teacher-only since 2026-09-02
strata_buckets = 470
share = 1.0
