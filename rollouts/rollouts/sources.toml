# Source registry: every task source is one declarative block.
# Adding a source = adding one block (+ a catalog builder if its kind is new).
#
# [mix] targets are shares of KEPT TURNS (records that survive the
# duel_turns view + prefilter) per group — not attempts. The scheduler
# steers generation toward these; ops/datagen_refresh.py enforces the same
# targets at fold time.

[mix]
# Generation targets. Dialect cutover (2026-09-01): math + tool_use are
# generated from now on so a backlog stages behind the closed
# [dataset].allowed_action_kinds gate and lands on day one of the fork.
coding = 0.50
terminal = 0.25
nl2repo = 0.05
math = 0.10
tool_use = 0.10

# Fold-side override while the gate is closed. Without it the fold waterfill
# would see coding/terminal above their new targets and defer them for the
# whole notice period while math/tool_use cannot be admitted yet. DELETE
# this block in the wvk-11 fork commit so the fold follows [mix].
[fold_mix]
coding = 0.60
terminal = 0.30
nl2repo = 0.10

# Language targets for NEWLY FOLDED coding turns (2026-09-01). Enforced by
# ops/datagen_refresh.py as a second waterfill (after the group waterfill)
# keyed by rec["language"], with cumulative counts in state["lang_counts"].
# Existing corpus turns are never rebalanced. Tag → bucket aliasing lives in
# the fold script: rust→rs, js/ts/typescript/javascript→tsjs, cpp/c→rs,
# php→tsjs, missing/unknown→python.
[lang_mix.coding]
python = 0.25
go = 0.20
java = 0.20
rs = 0.20
tsjs = 0.15

[defaults]
# Policy ids from policies.toml; sources may override with `policies = [...]`.
# Scheduler picks by per-policy kept-turn deficit (equal shares here, so
# the three harnesses split new turns evenly).
# 2026-09-02: teacher-only. The GLM seat (glm_* policies, still defined in
# policies.toml) is switched off by operator decision — every new prefix is
# the duel teacher's own history, so duel-time refs stay on-policy.
policies = ["teacher_textbased", "teacher_bashtool", "teacher_pi"]

# -- coding --------------------------------------------------------------------

[source.swerebench_main]
# The former main datagen loop (mini-swe-agent on the nebius pool).
# Retired 2026-09-01 (share 0): old Python-only dump whose 97 repos overlap
# the 860-task exam — the block stays so source → group mapping keeps
# resolving for already-staged records.
group = "coding"
runner = "mini_swe"
catalog = "hf_swebench"
dataset = "nebius/SWE-rebench"
split = "filtered"
swe_eval = true          # swebench verdict as rewards.solved telemetry
share = 0.0

[source.scaleswe]
group = "coding"
runner = "verifiers"
taskset_id = "scaleswe-v1"
catalog = "hf"
dataset = "PrimeIntellect/Scale-SWE-Verified"
split = "train"
row_meta = "scaleswe"
share = 3.0
# Catalog + pull failures already cover availability; the taskset's own
# docker-hub tag enumeration costs ~17 registry calls per batch.
extra_flags = ["--env.taskset.filter-unavailable-images", "False"]

[source.swerebench_v2]
group = "coding"
runner = "verifiers"
taskset_id = "swerebench-v2-full"
catalog = "hf"
dataset = "PrimeIntellect/SWE-rebench-V2"
split = "train"
row_meta = "swerebench_v2"
share = 2.0

[source.r2e_gym]
