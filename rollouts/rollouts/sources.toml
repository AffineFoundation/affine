# -- coding: Harbor-packaged SWE benchmarks (2026-09-02) -----------------------
#
# All three load on the pod (catalog = "harbor_swe") with public Docker Hub
# images. They ship at share 0.0 because each is a PUBLIC TEST BENCHMARK:
# putting its tasks in D teaches every miner the yardstick the field grades
# with, and Verified's repos overlap our advisory swe-rebench bench (the
# reason swerebench_main was retired). Turning one on is an operator call —
# set share > 0 and the scheduler picks it up on the next supervisor restart.

[source.swebench_multilingual]
# 300 tasks, 9 languages (C, C++, Go, Java, JS/TS, PHP, Ruby, Rust) — the
# only one of the three that adds language coverage.
group = "coding"
runner = "verifiers"
taskset_id = "swebench-multilingual-v1"
catalog = "harbor_swe"
select = "tasks"
pass_dataset = false
task_id_basename = true
share = 0.0

[source.swebench_verified]
# 500 Python tasks from the 12 classic repos (django, sympy, astropy, ...).
group = "coding"
runner = "verifiers"
taskset_id = "swebench-verified-v1"
catalog = "harbor_swe"
select = "tasks"
pass_dataset = false
task_id_basename = true
share = 0.0

[source.swebench_pro]
# 731 tasks (Scale AI) across 11 repos — Python (ansible, openlibrary,
# qutebrowser), Go (flipt, teleport, vuls, navidrome), TS/JS (protonmail,
