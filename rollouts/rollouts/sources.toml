# Source registry: every task source is one declarative block.
# Adding a source = adding one block (+ a catalog builder if its kind is new).
#
# [mix] targets are shares of KEPT TURNS (records that survive the
# duel_turns view + prefilter) per group — not attempts. The scheduler
# steers generation toward these; ops/datagen_refresh.py enforces the same
# targets at fold time.

[mix]
# Generation targets. Dialect cutover (2026-09-01): math + tool_use are
# generated from now on so a backlog stages behind the closed
# [dataset].allowed_action_kinds gate and lands on day one of the fork.
# 2026-09-10: + king_fail (see [king_fail]); the other five scaled by 0.9
# so the table still sums to 1. king_fail has no source of its own — the
# fold assigns it (the scheduler ignores a group without sources), so the
# generation targets of the five real groups are unchanged in ratio.
# 2026-09-11: king_fail 0.10 -> 0.07 + king_loop_onset 0.03 (see
# [king_loop_onset]); the share moves inside the king seat, the five real
# groups are untouched.
# 2026-09-11 (env wave 1, data plan W3): + general = 0.10 (eight new Prime
# RL sources, see "-- general --" below); every other group scaled by 0.9.
# GENERATION target only — the fold reads [fold_mix] while that block
# exists (ops/corpus_build.py load_mix), so the slice share of `general`
# is decided there, not here.
coding = 0.405
terminal = 0.2025
nl2repo = 0.0405
math = 0.081
tool_use = 0.081
king_fail = 0.063
king_loop_onset = 0.027
general = 0.1

[fold_mix]
# FOLD targets (slice strata shares) — overrides [mix] for ops/corpus_build.py
# while this block exists. Added 2026-09-11 with env wave 1 so the eight
# `general` sources GENERATE (teacher-first: traces land on R2, the
# scheduler steers by [mix]) while their slice share stays an operator
# decision: at 0.0 the fold defers every `general` record whole (cap_fill:
# "keys without a positive target are deferred") and admits nothing from
# the group until the value is raised. The first fold read of mean_r_leg /
# ref yield per source decides the share. To decide: set `general` here
# (proposal: 0.05, the others scaled to sum 1.0) or delete this block to
# let [mix] drive the fold too. KEEP IN STEP WITH [mix] for every other
# group: a group present in [mix] but missing here folds into
# DEFAULT_GROUP (coding).
coding = 0.45
terminal = 0.225
nl2repo = 0.045
math = 0.09
tool_use = 0.09
king_fail = 0.07
king_loop_onset = 0.03
general = 0.0

[king_fail]
# The king's FAILED rollouts (policies king_*, rewards.solved == 0), any
# source, any dialect — one fold group so their slice share is a single
# dial. Bucketed strata `king_fail:NNNN` = sha256(instance_id) % buckets,
# a namespace of its own: the same repo's teacher rollouts live in
# `<repo>|<phase>` strata, and sharing those would add "within-stratum
# variety" and move no share (cap_fill). Sizing as for math: D holds
# ~10.2k strata (2026-09-10), so 10% of the slice ≈ 1,000 buckets;
# occupied buckets grow as failures land (300 failed tasks ≈ 260 buckets
# ≈ 2.5% of the slice). Re-derive UPWARD as D grows; never lower.
# Successful and unscored king rollouts are dropped at the fold
# (`king_not_failed` / `king_unscored` in the drop counts).
strata_buckets = 1000
policy_prefix = "king_"

[king_loop_onset]
# The first turn of every LOOP in the king's failed rollouts (2026-09-11,
# operator directive; data event, no weight_version_key change). A loop:
# the king re-issues a command it already ran and gets the same
# observation back (affine/corpus/loops.py; 93 % of onsets are verbatim
# repeats). Measured 2026-09-11: 49-100 % of the king's failed agent
# rollouts loop (teacher 8-13 %), yet 1.1 % of king_fail turns were loop
# turns — a repeated command is a "reference leaked into the prefix" for
# the slicer, so 86 % of onsets never reached D. The fold waives THAT rule
# for onset turns only (the stored reference is never scored under
# min(R,G); teacher refs are sampled fresh at duel time); caps, dialect
# gate, panel and action-count rules still apply. Later turns of the same
# loop are dropped (king_in_loop: near-duplicate prefixes); the turns
# before / after a loop keep the king_fail path. Strata
# `king_loop_onset:NNNN` = sha256(instance_id) % buckets, own namespace as
# for king_fail; ~665 looping tasks in the first 36 h -> ~480 buckets
# occupied at 1000, ~1,000 onsets/day arrive at the current seat rate.
# exclude_sources: tool_use — the teacher's next tool call is
# near-deterministic there (centered R ~ 0, wvk-11 findings), so a wiki
# loop prefix carries no signal; those rollouts stay on king_fail.
strata_buckets = 1000
policy_prefix = "king_"
exclude_sources = ["affine_wiki", "affine_agent"]

# Language targets for NEWLY FOLDED coding turns (2026-09-01). Enforced by
# ops/datagen_refresh.py as a second waterfill (after the group waterfill)
# keyed by rec["language"], with cumulative counts in state["lang_counts"].
# Existing corpus turns are never rebalanced. Tag → bucket aliasing lives in
# the fold script: rust→rs, js/ts/typescript/javascript→tsjs, cpp/c→rs,
# php→tsjs, missing/unknown→python.
[lang_mix.coding]
python = 0.25
go = 0.20
java = 0.20
rs = 0.20
tsjs = 0.15

[defaults]
# Policy ids from policies.toml; sources may override with `policies = [...]`.
# Scheduler picks by per-policy kept-turn deficit (equal shares here, so
# the three harnesses split new turns evenly).
# 2026-09-02: teacher-only. The GLM seat (glm_* policies, still defined in
# policies.toml) is switched off by operator decision — every new prefix is
# the duel teacher's own history, so duel-time refs stay on-policy.
# 2026-09-07: + teacher_claude_code (IDE-agent prompt family; verifiers'
# claude_code harness). Datagen-pod probe on 2 terminal-bench-2 tasks:
# 26 replies -> 16 tool_call turns, 0 drops, baked parity held, dialect
# marker present, prefixes 88-107k chars (Claude Code's 80k-char system
# prompt + tool schemas; under the 120k slicer cap). teacher_codex stays
# staged: Codex sends two leading system messages the teacher template
# cannot render (see policies.toml).
# 2026-09-10: + the king seat (king_* in policies.toml, share 1.0 vs the
# teacher's 2.0). Idle until the controller has served the current king.
# 2026-09-10 (evening, operator: data broad enough for "a really good
# agent" — Claude Code, Hermes, the terminal-bench agent, ...): + kimi_code,
# hermes_agent and terminus_2 harnesses, teacher + king each. Datagen-pod
# probes with the KING on terminal-bench-2 tasks (2 each, 12-40 turns):
#   kimi_code   27 tool_call turns kept / 0 drops, prefixes 94-126k chars
#               (Kimi's system prompt; under the 300k slicer cap).
#   terminus_2  29 terminus_json turns kept / 0 drops, one task SOLVED by
#               the king, replies are the bare JSON object. Dialect
#               REGISTERED, NOT ADMITTED: turns stage behind
#               [dataset].allowed_action_kinds until the operator's fork
#               decision (the fold reports action_kind_not_admitted).
#   hermes_agent tool_call, one call per reply (see policies.toml); probe
#               yield below.
# Seats (scheduler.py): the king replays tasks the teacher has finished,
# so terminal / math / tool_use / nl2repo pools exhausted by the teacher
# are open to the king — before, king failures came from 3 coding sources.
policies = ["teacher_textbased", "teacher_bashtool", "teacher_pi",
            "teacher_claude_code", "teacher_kimi", "teacher_hermes",
            "teacher_terminus",
            "king_textbased", "king_bashtool", "king_pi", "king_claude_code",
            "king_kimi", "king_hermes", "king_terminus"]

