# -- math (boxed dialect) --------------------------------------------------------
#
# strata_buckets sets the SLICE share, not the turn share: sample_slice
# draws ~1 turn per stratum per duel, so share ≈ buckets / total strata.
# Since 2026-09-04 the FOLD assigns these strata (ops/corpus_build.py
# assign_bucket_strata: sha256(instance_id) % n) from the value here, so one
# setting governs D; datagen's own stamp is overwritten. Sizing: the schema-3
# D (traces only) enters T0 with ~4,150 coding strata after the language cap,
# and the group cap holds terminal at half of coding; math at 10% of the
# slice therefore needs 0.10/0.50 × 4,150 ≈ 830 buckets. Raising n later only
# adds bucket names above the old range (immutable shards keep theirs), so
# re-derive UPWARD as coding grows; never lower it.

[source.affine_math]
group = "math"
runner = "verifiers_chat"           # harness null, subprocess runtime
taskset_id = "affine-math-v1"       # rollouts/envs/affine_math_v1
catalog = "hf"
dataset = "DigitalLearningGmbH/MATH-lighteval"
split = "train"
row_meta = "math"
select = "tasks"
pass_dataset = false
policies = ["teacher_boxed", "king_boxed"]   # teacher-only since 2026-09-02; + king seat 2026-09-10
strata_buckets = 830                    # 470 -> 830 at T0 (2026-09-04), see above
share = 1.0

