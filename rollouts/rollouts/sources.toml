catalog = "hf"
dataset = "willcb/wiki-trivia-questions-v4"
split = "train"
row_meta = "wiki_trivia"
select = "tasks"
pass_dataset = false
policies = ["teacher_toolcall", "king_toolcall"]   # teacher-only since 2026-09-02; + king seat 2026-09-10
# 478 tasks total, so strata <= tasks; 470 already ~one task per bucket.
# Exhausted 2026-09-02 (one pass, tasks never re-run); affine_agent below is
# the second tool source that lets tool_use approach 10% of the slice.
strata_buckets = 470
share = 1.0

[source.affine_agent]
# general-agent toolbench (PrimeIntellect research-environments,
# tool_use/general_agent_v1): 4,417 multi-turn tasks, each with its own
# database + tool set served on the host per rollout, DB-hash graded
# (telemetry only). Wrapped by rollouts/envs/affine_agent_v1, which adds the
# system-message tool contract the fold requires for `tool_call` turns.
# Corpus (~320 MB) is pulled once per pod into ~/.cache/harbor by
# general_agent_v1.corpus.ensure_corpus() (run in the verifiers env).
# Added 2026-09-07: tool_use sat at 3.5% of the slice (target 10%) with
# affine_wiki exhausted. Sizing per the math note above: tool_use at 10%
# against ~4,800 coding strata needs ~960 buckets in total; wiki holds 470,
# so 500 here. Re-derive upward as coding grows; never lower.
# strata_offset: bucket names are per GROUP (`tool_use:NNNN`); wiki owns
# 0000-0469, so this source starts at 0470 — otherwise the two sources
# would collide into the same 470 names and add no slice share.
group = "tool_use"
runner = "verifiers_chat"
taskset_id = "affine-agent-v1"
catalog = "general_agent"
select = "tasks"
pass_dataset = false
policies = ["teacher_toolcall", "king_toolcall"]
strata_buckets = 500
strata_offset = 470
share = 1.0
