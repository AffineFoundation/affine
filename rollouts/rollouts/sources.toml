# .nocontext TRAIN questions (61,888; validation stays out of D), tools
# sampled per question id from a 24-tool pool of calendar / email / smart-
# home / travel / finance / file actions that cannot answer anything. The
# right reply is prose: `solved` = correct alias AND zero tool calls;
# `correct` and `tool_called` are metrics. A rollout that keeps calling
# tools is cut at 4 turns under the name `max_turns` (clean failure).
# Probe 2026-09-13 (datagen-2): teacher 0/5 tool calls, 3/5 solved; king
# (reign 12) 5/8 called a tool and looped to the cap, 1/8 solved.
# Policies are the tool_call trio (null harness with tool schemas): the
# teacher's prose answer folds as a `text` turn (text_final rule), the
# king's tool call as `tool_call` — the `king_tooluse` material; the fold
# worker adds this source to [king_tooluse].sources (see the
# improvement-loop doc). tool_use bucket namespace: wiki 0-469, agent
