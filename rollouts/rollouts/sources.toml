# Source registry: every task source is one declarative block.
# Adding a source = adding one block (+ a catalog builder if its kind is new).
#
# [mix] targets are shares of KEPT TURNS (records that survive the
# duel_turns view + prefilter) per group — not attempts. The scheduler
# steers generation toward these; ops/datagen_refresh.py enforces the same
# targets at fold time.

[mix]
# Generation targets. Dialect cutover (2026-09-01): math + tool_use are
# generated from now on so a backlog stages behind the closed
# [dataset].allowed_action_kinds gate and lands on day one of the fork.
coding = 0.50
terminal = 0.25
nl2repo = 0.05
math = 0.10
tool_use = 0.10

# Language targets for NEWLY FOLDED coding turns (2026-09-01). Enforced by
# ops/datagen_refresh.py as a second waterfill (after the group waterfill)
# keyed by rec["language"], with cumulative counts in state["lang_counts"].
# Existing corpus turns are never rebalanced. Tag → bucket aliasing lives in
# the fold script: rust→rs, js/ts/typescript/javascript→tsjs, cpp/c→rs,
# php→tsjs, missing/unknown→python.
[lang_mix.coding]
python = 0.25
go = 0.20
java = 0.20
rs = 0.20
tsjs = 0.15

[defaults]
# Policy ids from policies.toml; sources may override with `policies = [...]`.
# Scheduler picks by per-policy kept-turn deficit (equal shares here, so
# the three harnesses split new turns evenly).
# 2026-09-02: teacher-only. The GLM seat (glm_* policies, still defined in
# policies.toml) is switched off by operator decision — every new prefix is
# the duel teacher's own history, so duel-time refs stay on-policy.
# 2026-09-07: + teacher_claude_code (IDE-agent prompt family; verifiers'
# claude_code harness). Datagen-pod probe on 2 terminal-bench-2 tasks:
# 26 replies -> 16 tool_call turns, 0 drops, baked parity held, dialect
# marker present, prefixes 88-107k chars (Claude Code's 80k-char system
# prompt + tool schemas; under the 120k slicer cap). teacher_codex stays
# staged: Codex sends two leading system messages the teacher template
# cannot render (see policies.toml).
policies = ["teacher_textbased", "teacher_bashtool", "teacher_pi",
            "teacher_claude_code"]

