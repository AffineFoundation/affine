# -- general (env wave 1, 2026-09-11; data plan W3 "environment breadth") ---------
#
# Eight Prime RL environments outside the coding / terminal axis, onboarded
# TEACHER-FIRST (2026-09-11: teacher policies only). 2026-09-12 (data plan
# W3 part A): the king seat joins every source — king_text on the `text`
# sources, king_boxed / king_toolcall / the shell kings where the harness
# requires — so kings.affine.io shows king-vs-teacher on the same tasks
# (the seat scheduler replays the teacher's pool for each king). Every
# source is a thin wrapper under rollouts/envs/affine_<x>_v1 over the
# research-environments taskset: a real system message (the fold drops
# prefixes without one), a `tasks` selector, and the grade under a fold key
# (`correct` / `solved`). Dialects are admitted ones only: `text` (whole
# visible reply), `boxed`, `tool_call`, and the shell dialects for prolog.
#
# One fold group `general` = one slice dial ([fold_mix].general, 0.0 until
# the operator sets it). Bucket names are per group, so the sources take
# disjoint `strata_offset` ranges (0-1829 in total = the group's CEILING;
# the [fold_mix] share caps what a slice actually holds):
#   affine_logic       0000-0339   affine_trivia      0340-0569
#   affine_ifeval      0570-0799   affine_science     0800-1139
#   affine_unscramble  1140-1254   affine_prolog      1255-1484
#   affine_needle      1485-1599   affine_wikispeedia 1600-1829
# Probe numbers (12 teacher rollouts each, datagen-4, 2026-09-11/12) are in
# the env-wave-1 report; shares below weight the GENERATION deficit inside
# the group only.

