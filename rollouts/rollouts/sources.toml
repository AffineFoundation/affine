# -- math (boxed dialect) --------------------------------------------------------
#
# strata_buckets sets the SLICE share, not the turn share: sample_slice
# draws ~1 turn per stratum per duel, so share ≈ buckets / total strata.
# Since 2026-09-04 the FOLD assigns these strata (ops/corpus_build.py
# assign_bucket_strata: sha256(instance_id) % n) from the value here, so one
# setting governs D; datagen's own stamp is overwritten. Sizing: the schema-3
# D (traces only) enters T0 with ~4,150 coding strata after the language cap,
# and the group cap holds terminal at half of coding; math at 10% of the
# slice therefore needs 0.10/0.50 × 4,150 ≈ 830 buckets. Raising n later only
# adds bucket names above the old range (immutable shards keep theirs), so
# re-derive UPWARD as coding grows; never lower it.

[source.affine_math]
group = "math"
runner = "verifiers_chat"           # harness null, subprocess runtime
taskset_id = "affine-math-v1"       # rollouts/envs/affine_math_v1
catalog = "hf"
dataset = "DigitalLearningGmbH/MATH-lighteval"
split = "train"
row_meta = "math"
select = "tasks"
pass_dataset = false
policies = ["teacher_boxed"]           # teacher-only since 2026-09-02
strata_buckets = 830                    # 470 -> 830 at T0 (2026-09-04), see above
share = 1.0

# -- tool_use (tool_call dialect) -----------------------------------------------

[source.affine_wiki]
group = "tool_use"
runner = "verifiers_chat"
taskset_id = "affine-wiki-v1"       # rollouts/envs/affine_wiki_v1
catalog = "hf"
dataset = "willcb/wiki-trivia-questions-v4"
split = "train"
row_meta = "wiki_trivia"
select = "tasks"
pass_dataset = false
policies = ["teacher_toolcall"]        # teacher-only since 2026-09-02
# 478 tasks total, so strata <= tasks; 470 already ~one task per bucket.
# Exhausted 2026-09-02 (one pass, tasks never re-run); affine_agent below is
# the second tool source that lets tool_use approach 10% of the slice.
strata_buckets = 470
share = 1.0

[source.affine_agent]
# general-agent toolbench (PrimeIntellect research-environments,
# tool_use/general_agent_v1): 4,417 multi-turn tasks, each with its own
# database + tool set served on the host per rollout, DB-hash graded
# (telemetry only). Wrapped by rollouts/envs/affine_agent_v1, which adds the
# system-message tool contract the fold requires for `tool_call` turns.
# Corpus (~320 MB) is pulled once per pod into ~/.cache/harbor by
# general_agent_v1.corpus.ensure_corpus() (run in the verifiers env).
# Added 2026-09-07: tool_use sat at 3.5% of the slice (target 10%) with
# affine_wiki exhausted. Sizing per the math note above: tool_use at 10%
# against ~4,800 coding strata needs ~960 buckets in total; wiki holds 470,
# so 500 here. Re-derive upward as coding grows; never lower.
# strata_offset: bucket names are per GROUP (`tool_use:NNNN`); wiki owns
# 0000-0469, so this source starts at 0470 — otherwise the two sources
# would collide into the same 470 names and add no slice share.
group = "tool_use"
runner = "verifiers_chat"
taskset_id = "affine-agent-v1"
catalog = "general_agent"
select = "tasks"
pass_dataset = false
policies = ["teacher_toolcall"]
strata_buckets = 500
strata_offset = 470
share = 1.0
