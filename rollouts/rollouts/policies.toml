# -- IDE-agent harnesses (staged 2026-09-07; defined, NOT scheduled) ----------
# Why: D held only agent-scaffold prompt families (mini-swe textbased,
# verifiers bash, pi). Kings fine-tuned on it collapse on IDE-shaped prompts
# — the reign-8 king never closes </think> under a Cursor-style system
# prompt and renders as an empty reply. Teacher rollouts under REAL IDE /
# CLI coding agents put those prompt families into D: the teacher's
# thoughts on such turns become the grounding band, so R and G reward
# in-distribution behaviour for the case we care about. verifiers ships
# the agents; nothing is hand-rolled here. Cursor itself has no verifiers
# harness and cannot have one for datagen (its agent loop runs on Cursor's
# servers against Cursor's catalog, so it cannot be pointed at the teacher
# through the interception server); Cursor-shaped prompts are checked by
# the eval-pod protocol probe instead (affine.toml [protocol_probe]).
#
# Both are ACP agents like `pi`: node installed in the task container at
# setup, a long product system prompt, their own tool set, native tool
# calls -> tool_call dialect; codex speaks OpenAI Responses and claude_code
# Anthropic Messages, both translated by the interception server. Shares
# mirror teacher_bashtool / teacher_pi so, once enabled, the four harnesses
# split new coding/terminal turns ~evenly.
#
# Probe 2026-09-07 (2 terminal-bench-2 tasks each, teacher via engy):
#   claude_code — LIVE (in [defaults].policies since 2026-09-07). 26 replies
#     -> 16 tool_call turns, 0 drops, parity held, marker present. Speaks
#     Anthropic Messages (/v1/messages, thinking adaptive); the teacher's
#     reasoning lands in reasoning_content, visible content is a one-line
#     intent + one tool call — exactly the IDE shape. 4/36 replies were
#     multi-call (dropped by the one-action rule, real history otherwise).
#   codex — STAGED, do not enable as is. Rollouts run (14 calls, completed)
#     but Codex talks OpenAI Responses (/responses) and sends TWO leading
#     system messages (its instructions + a <permissions instructions>
#     block); the teacher's template refuses a second system message
#     ("System message must be at the beginning"), so every Codex trace is
#     a ToolParityError at the fold — zero turns, wasted spend. Enabling it
#     needs a view decision: merge leading system messages (the join string
#     is a guess at what engy's Responses translation rendered) or a
#     Codex-specific adapter. Also: assistant visible content is empty
#     ("\n\n\n") — Codex hides reasoning — so D turns would carry no visible
#     thought; and it issues parallel tool calls (2 per reply) despite
#     parallel_tool_calls=false, which the one-action rule drops.
# Data event, not a fork: tool_call is admitted since wvk 11, no [mix]
# change, no wvk bump. Enabling = add the id to [defaults].policies in
# sources.toml, sync the toml to the datagen pods, restart the supervisors.

[policy.teacher_codex]
harness = "codex"
action_kind = "tool_call"
share = 2.0

[policy.teacher_codex.sampling]
temperature = 0.8

[[policy.teacher_codex.endpoints]]
name = "engy"
model = "qwen3.8-27b"
base_url = "https://api.engy.ai/v1"
key_env = "ENGY"

[policy.teacher_claude_code]
harness = "claude_code"
action_kind = "tool_call"
share = 2.0

[policy.teacher_claude_code.sampling]
temperature = 0.8

[[policy.teacher_claude_code.endpoints]]
name = "engy"
model = "qwen3.8-27b"
base_url = "https://api.engy.ai/v1"
key_env = "ENGY"

# -- the king seat (2026-09-10) ------------------------------------------------
# The current SN120 king plays the agent seat on the same envs the teacher
# plays, one policy per harness. Only its FAILED rollouts enter D (fold group
# `king_fail`, ops/corpus_build.py): those prefixes are the king's own
# history at the places it went wrong, and the duel then asks both sides
# "what does the teacher do from here?" — the king tends to repeat itself,
# the teacher does not, so a challenger that recovers like the teacher wins
# exactly where the incumbent is weak. Successes and unscored rollouts are
# dropped at the fold (they are not the signal); every rollout still ships
# to traces/ for provenance.
#
# Routing is dynamic: model + base_url come from KING_MODEL / KING_BASE_URL
# (rollouts/king.py reads /root/rollouts/.king_env every cycle; the
# validator-side controller ops/king-datagen/kingctl.py writes it after it
# has served the new king). No file -> these policies are idle and the
# scheduler falls back to the teacher policies. The served model name is
# `king-<digest12>` (KING_MODEL), so the envelope's policy.model label reads
# `king/king-0ce59769300c` and every trace names the king it came from;
# KING_DIGEST / KING_REIGN ride along for the log.
# Shares: 2.0 against the teacher's 2.0 (1.0 until 2026-09-11, operator
# directive) -> ~1/2 of new rollouts per source are king rollouts while the
# seat is up. Sampling 0.8 = [duel] temperature.
#
# Loop guard (2026-09-11, rollouts.loopguard): `loop_guard_repeats = N` ends
# a rollout with stop_condition `loop_guard` once the same action repeats N
# times in a row with the same observation (label_loops.py definition:
# exact after whitespace normalization, observation first 200 chars). The
# onset and its repeats stay in the trace for the `king_loop_onset` fold
# group; the fold classifies the rollout as failed. Default: 6 for every
# `king_*` policy, 0 (off) for the others — set the key to override.


[policy.king_textbased]
harness = "mini_swe_textbased"
share = 2.0

[policy.king_textbased.sampling]
temperature = 0.8

[[policy.king_textbased.endpoints]]
name = "king"
model_env = "KING_MODEL"
base_url_env = "KING_BASE_URL"
key_env = "KING_KEY"

[policy.king_bashtool]
harness = "bash"
action_kind = "tool_call"
share = 2.0

[policy.king_bashtool.sampling]
temperature = 0.8

[[policy.king_bashtool.endpoints]]
name = "king"
model_env = "KING_MODEL"
base_url_env = "KING_BASE_URL"
key_env = "KING_KEY"

[policy.king_pi]
harness = "pi"
action_kind = "tool_call"
share = 2.0

[policy.king_pi.sampling]
temperature = 0.8

[[policy.king_pi.endpoints]]
name = "king"
model_env = "KING_MODEL"
base_url_env = "KING_BASE_URL"
key_env = "KING_KEY"

[policy.king_claude_code]
harness = "claude_code"
action_kind = "tool_call"
share = 2.0

[policy.king_claude_code.sampling]
temperature = 0.8

[[policy.king_claude_code.endpoints]]
name = "king"
model_env = "KING_MODEL"
base_url_env = "KING_BASE_URL"
key_env = "KING_KEY"

[policy.king_boxed]
harness = "null"
action_kind = "boxed"
share = 2.0

[policy.king_boxed.sampling]
temperature = 0.8
# Runaway guard: the king box serves 262k context and the null harness
# sets no cap, so one looping math reply held a 24-task batch for the
# whole 3600 s rollout timeout (datagen-2, 2026-09-10 19:54). Teacher
# math replies are p50 557 tokens; a reply past 16k has no `\boxed{}`
# worth keeping.
max_tokens = 16384

[[policy.king_boxed.endpoints]]
name = "king"
model_env = "KING_MODEL"
base_url_env = "KING_BASE_URL"
key_env = "KING_KEY"

[policy.king_toolcall]
harness = "null"
action_kind = "tool_call"
share = 2.0

[policy.king_toolcall.sampling]
temperature = 0.8
max_tokens = 16384  # same runaway guard as king_boxed (null harness, no cap)

[[policy.king_toolcall.endpoints]]
name = "king"
model_env = "KING_MODEL"
base_url_env = "KING_BASE_URL"
key_env = "KING_KEY"

