# Model registry: references and Genesis (kings come from affine.io/performance.json). Adding a reference = one block.
#   kind      genesis | reference   (king rows are added automatically)
#   hf        <repo>@<revision>     (pinned commit; downloaded from public HF on the node, no token)
#   reasoning_parser   vLLM --reasoning-parser so the graded reply is the final answer, not the thinking
#   priority  order among Genesis + references (lower first). Queue: newest king, new GREEN kings (crowned < 6 h ago),
#             then Genesis + ALL references, then the GREEN backlog, then every other king (daemon.queue)
#   chat_template   bench/config/templates/<file>, only when the model card asks for a non-default prompt to enable thinking
#   Sampling / max_tokens / max_model_len: bench-v2 per-model native protocol in model_settings.toml (64K ceiling).
#   Do not set max_model_len / hf_overrides here for context window — resolve_settings clamps to native_context.
