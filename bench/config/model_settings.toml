# Per-model native sampling for affine-bench-v2 (Jacob 2026-11-05).
# Global ceiling: max_tokens <= 65536. max_model_len = max_tokens + prompt_headroom, never past native context.
# Kings / Genesis inherit profile "qwen3.5-family" (Affine kings are Qwen3.5-9B fine-tunes).
# Citations point at the HF model card / tech report that justified each row (see REPORT.md).

prompt_headroom = 4096
global_max_tokens_ceiling = 65536

default_profile = "qwen3.5-family"
# Affine kings: presence_penalty 0 (Jacob 2026-11-09 / PR #95 / SPEC §3.2). Comparison models keep 1.5.
king_profile = "qwen3.5-family-pp0"

[profiles."qwen3.5-family"]
# Qwen/Qwen3.5-9B Best Practices: thinking general + math/competition length (capped at 64K ceiling; card says 81920).
# MathArena uses the same sampling (temp 1.0, top_k 20, presence_penalty 1.5): https://matharena.ai/models/qwen_qwen3_5_9b
# https://huggingface.co/Qwen/Qwen3.5-9B
max_tokens = 65536
native_context = 262144
temperature = 1.0
top_p = 0.95
top_k = 20
min_p = 0.0
presence_penalty = 1.5
repetition_penalty = 1.0
enable_thinking = true
source = "https://huggingface.co/Qwen/Qwen3.5-9B (Best Practices: thinking general + 81920 for math contests; Affine caps at 65536)"

[profiles."qwen3.5-family-pp0"]
# Same as qwen3.5-family but presence_penalty=0 for Affine kings (not trained with a presence penalty).
max_tokens = 65536
native_context = 262144
temperature = 1.0
top_p = 0.95
top_k = 20
min_p = 0.0
presence_penalty = 0.0
repetition_penalty = 1.0
enable_thinking = true
source = "Affine king default (PR #95): qwen3.5-family sampling with presence_penalty 0"

