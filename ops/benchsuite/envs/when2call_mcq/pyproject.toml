[project]
name = "when2call-mcq"
version = "0.1.0"
description = "NVIDIA When2Call TEST split (MCQ), generative 4-way choice: call a tool / answer / ask / cannot answer. Affine benchmark suite, held out from D."
requires-python = ">=3.11"
tags = ["single-turn", "tool-use", "v1", "affine-benchsuite"]
dependencies = [
    "verifiers>=0.3.1",
    "gpqa",
    "huggingface-hub",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["when2call_mcq"]
