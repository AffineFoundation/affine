taskset = "aime25"
install = "math/aime25"
group = "math"
n = -1
harness = "null"
runtime = "none"
max_tokens = 32768
reward = "correct"
secondary = true
secondary_rollouts = 4
note = "AIME 2025 I+II, 30 problems; math-verify on the boxed integer."

