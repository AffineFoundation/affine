# Affine benchmark suite (data-only plan W7): a per-reign evaluation
# scorecard of the king against the teacher on standard, held-out
# benchmarks. MONITORING ONLY — nothing here feeds the duel, the fold, D,
# affine.toml or weight_version_key. Benchmark rollouts are written to
# R2 `research/benchsuite/<run_id>/` (affine-data bucket), never to
# `traces/` or any prefix the fold reads.
#
# Every env is a Prime Intellect research-environments v1 taskset run with
# `uv run eval` (verifiers). Fixed task order per env: the taskset's own
# order (`n = -1` = every task) or a `--shuffle` view under verifiers' fixed
# seed 0 for a fixed-size subset, so reigns are comparable. Greedy decoding
# (temperature 0) is the primary row; temperature 0.8 is a secondary row on
# the cheap chat sets only.

[suite]
name = "affine-benchsuite"
version = 2
# Pinned upstream code; recorded in every run manifest.
verifiers_repo = "https://github.com/PrimeIntellect-ai/verifiers.git"
verifiers_commit = "a32cc09"
research_envs_repo = "https://github.com/PrimeIntellect-ai/research-environments.git"
research_envs_commit = "c4d04df"
# Prime Evals: every cell is pushed to the Prime Intellect Evaluations tab of this
# account (username set 2026-09-13; without it every push fails).
prime_evals_username = "arbos"
prime_evals_account_id = "cmjormgul003e1pl9z71whoka"
# R2 destination (affine-data bucket). Read back publicly at
# https://data.affine.io/research/benchsuite/<run_id>/.
r2_bucket = "affine-data"
r2_prefix = "research/benchsuite/"
# Local scorecard summaries the kingboard reads.
state_dir = "affine/state/benchsuite"

[teacher]
hf_repo = "Qwen/Qwen3.8-27B"
served_name = "teacher"

[serving]
# vLLM flags shared by the king and the teacher: the chat-box stack.
vllm_version = "0.28.0"
max_model_len = 131072
gpu_memory_utilization = 0.90
max_num_batched_tokens = 16384
max_num_seqs = 64
reasoning_parser = "qwen3"
tool_call_parser = "qwen3_xml"

# ------------------------------------------------------------------ modes
# Where a pass runs (run_pass.sh <digest|ref> <reign|label> <run_id> [MODE]).
# Operator decisions 2026-09-13: first "all on Prime" (consistency), then
# "in-house on Lium, paid in TAO" for the standing per-reign runs. The design
# centre is the fixed serving stack + pinned versions (suite.lock.json), so a
# Lium run and a Prime run of the same king are comparable; the parity check
# (docs/benchsuite.md §9) measures the residual hardware effect.
#
#   lium    DEFAULT. King on a Lium pod from our fleet (kingpod.py ->
#           ops/king-datagen/bootstrap_king.sh: vLLM 0.28.0, qwen3 parsers,
#           same layout as the king seat), eval driver on the same pod (Lium
#           DinD templates ship docker), teacher reused from `teacher_from`,
#           same cells/seeds/caps as Prime. Chat sets always; sandbox sets
#           under docker on the pod when a chat cell moved (or the flag).
#
#   prime   DEFAULT. King only, served on a Prime pod ([prime]; 4 TP2 replicas
#           on 8 GPUs), teacher baseline copied forward from `teacher_from`
#           (frozen teacher + fixed tasks + T=0 => it does not change until
#           the suite version does). Chat sets always (docker on the pod).
#           Sandbox sets (SWE-bench Verified, miniF2F, long-context) on Prime
#           sandboxes ONLY when a king chat cell moves outside the previous
#           published run's 95% interval (run_suite.py compare) or
#           BENCHSUITE_FORCE_SANDBOX=1. Pod terminated after.
#   full    The reference pass: king + teacher served side by side (2 TP2
#           replicas each), every env; used once per suite version to refresh
#           the teacher baseline (first run: reign 11, 2026-09-12).
#   comparables  A model Prime Inference already hosts ([comparables].models),
#           chat sets only (sandbox sets bill ~4 B prompt tokens per model at
#           API prices), eval driver on this box, no pod. Puts kings next to
#           frontier / open models at inference prices.
#   challenger   A losing challenger (private R2 ref), chat sets only, on a
#           Prime pod; watch.py runs the top-k losers with margin > 0 per day
#           ([challenger]) so duel margin vs benchmark score can be tested.
#   cheap   Fallback only (not used by watch): king on a Lium 1x H200 from
#           our fleet, chat sets, teacher reused; sandbox sets on Prime only
#           when a chat cell moves. Kept for a Prime outage.
#
# The bench pod (AFFINE_ROLE=bench) was checked as a host and rejected:
# evalsrv loads the miner per bench job and unloads it in `finally`, holds one
# busy lock per pod, and its vLLM port is not tunnelled.
[modes]
default = "lium"            # operator decision 2026-09-13 (later the same day): in-house GPUs paid in TAO
lium_plan = "h200-1x"       # [pods.plans.*]: 1x H200 = one TP1 replica, ~$3/h; the whole pass runs on that pod
# Sandbox sets on Lium: the pod's docker runs SWE-bench Verified (public Docker Hub
# images; a Docker Hub login lifts the anonymous pull cap), GraphWalks, Oolong, MRCR.
# miniF2F's Lean image lives in Prime's private Docker Hub org and pulls only through
# Prime sandboxes, so it stays on Prime (sandbox fee only, no Prime pod).
lium_docker_sandbox_envs = ["swebench-verified", "graphwalks", "oolong-synth", "mrcr-v2"]
lium_prime_sandbox_envs = ["minif2f"]
teacher_from = "20260912T1455Z-0ce59769300c"   # reference run whose teacher cells are reused
chat_envs = ["aime25", "math500", "gpqa-diamond", "mmlu-pro", "ifbench", "ifeval", "humaneval", "livecodebench", "bfcl-v3", "when2call"]
sandbox_envs = ["swebench-verified", "minif2f", "graphwalks", "oolong-synth", "mrcr-v2"]
# `agentic` pass mode (own pod, king only, merged into the king's card): docker
# on the pod for the Harbor sets, the tau2 orchestrator as a subprocess on the pod.
agentic_envs = ["terminal-bench-2", "tau2-airline", "tau2-retail", "tau2-telecom", "swebench-pro"]
agentic_cheap_envs = ["terminal-bench-2", "tau2-airline"]   # the first-look set (~$15 + ~$15 user-sim per model)
prime_king_replicas = "31001:0,1:2;31002:2,3:2;31003:4,5:2;31004:6,7:2"   # king-only pod layout
cheap_plan = "h200-1x"

[comparables]
# Prime Inference model ids (checked 2026-09-13; Qwen/Qwen3.8-27B is NOT hosted,
# Qwen3.6-35B-A3B — the genesis/king base — is). Prices USD per M tokens.
inference_url = "https://api.pinference.ai/api/v1"
key_env = "PRIME_API_KEY"
models = [
  { id = "qwen/qwen3.6-35b-a3b", label = "Qwen3.6-35B-A3B (genesis base)", input = 0.25, output = 1.25 },
  { id = "qwen/qwen3.6-27b", label = "Qwen3.6-27B", input = 0.6, output = 3.6 },
  { id = "qwen/qwen3.8-max", label = "Qwen3.8-Max", input = 2.0, output = 6.0 },
  { id = "deepseek/deepseek-v4-flash", label = "DeepSeek V4 Flash", input = 0.44, output = 1.32 },
  { id = "deepseek/deepseek-v4-pro", label = "DeepSeek V4 Pro", input = 1.91, output = 3.83 },
  { id = "moonshotai/kimi-k2.6", label = "Kimi K2.6", input = 0.95, output = 4.0 },
  { id = "minimax/minimax-m3", label = "MiniMax M3", input = 0.3, output = 1.2 },
  { id = "openai/gpt-5.4-mini", label = "GPT-5.4 mini", input = 0.75, output = 4.5 },
  { id = "anthropic/claude-sonnet-5", label = "Claude Sonnet 5", input = 2.0, output = 10.0 },
  { id = "google/gemini-3.8-flash", label = "Gemini 3.8 Flash", input = 0.75, output = 3.75 },
]

[challenger]
# watch.py: once per UTC day, the top-k LOSING challengers of the last
# `window_hours` by duel margin (margin > 0 = the near-misses) get a chat-only
# card on a Lium 1x H200 (~$15 each), published under the kingboard
# "Challengers" tab next to their duel margin. Enabled 2026-09-14 (operator).
per_day = 2
window_hours = 24
enabled = true

# ---------------------------------------------------------------- Prime path
# Prime Intellect pod that serves both models (pod_bootstrap.sh) and runs
# the eval driver. Chosen 2026-09-12 from live availability: no H200/B200
# on Prime that day; 8x A100 80GB gives 2 TP2 replicas per model.
[prime]
gpu_type = "A100_80GB"
gpu_count = 8
cloud_id = "gpu_8x_a100_80gb_sxm4"
image = "ubuntu_22_cuda_12"
king_replicas = "31001:0,1:2;31002:2,3:2"
teacher_replicas = "32001:4,5:2;32002:6,7:2"
king_url = "http://127.0.0.1:8001/v1"
teacher_url = "http://127.0.0.1:8002/v1"
# Hard stops (USD). The runner refuses to start a new env past either.
max_total_usd = 1200.0

# ------------------------------------------------------- Lium fallback path
# kingpod.py: our own rented box serving the king only (teacher via Engy).
[pods]
template_id = "345273fa-4818-46f7-a8fa-32f0e331713c"   # Pytorch (Cuda+DinD) cu13.0.2, same as the swarm
ttl_hours = 48
bootstrap_timeout_min = 60
vllm_version = "0.28.0"
max_model_len = 131072
gpu_memory_utilization = 0.90
max_num_batched_tokens = 16384
max_num_seqs = 64

[pods.plans.h200-1x]
match = "H200"
gpu_count = 1
tp = 1
replicas = 1
max_price = 5.0

[pods.plans.h200-8x]
match = "H200"
gpu_count = 8
tp = 2
replicas = 4
max_price = 50.0

[pods.plans.b200-8x]
match = "B200"
gpu_count = 8
tp = 1
replicas = 8
max_price = 60.0

# ------------------------------------------------------------------ sampling
[sampling]
primary_temperature = 0.0
secondary_temperature = 0.8

# ------------------------------------------------------------------ envs
# Fields:
#   id        row name on the scorecard
#   taskset   verifiers taskset id (`uv run eval <taskset>`)
#   install   research-environments path (or local `envs/<pkg>` for our wrappers)
#   group     scorecard group
#   n         -1 = every task; N>0 = the first N of the seed-0 shuffled view
#   harness   verifiers harness id
#   runtime   "none" (single-turn chat; still a container per task because the
#             tasksets carry a network policy), "sandbox" (agent in a box)
#   sandbox_vm  Prime runtime only: micro-VM sandbox (needed when the task
#             restricts egress); container sandbox otherwise
#   taskset_config  typed taskset knobs, passed as a TOML overlay
#   concurrency  fixed tasks-in-flight for the env (overrides the run's -c); with
#             rollout_timeout it is the env's budget, identical for every reign
#   max_tokens completion cap per model call
#   reward    the reward name that is the headline score
#   secondary  also run the temperature-0.8 row (cheap chat sets only)
#   args      extra `--env.taskset.*` flags

[[envs]]
