# Drop-in for /etc/systemd/system/pm2-const.service (the unit `pm2 startup`
# generates). Installed on ArbosLife 2026-09-13 06:12 UTC after the 00:24 UTC
# outage: the stock unit was boot-only (Type=forking, PIDFile in ~const/.pm2,
# never started), so the pm2 daemon lived in an SSH session scope and nothing
# restarted it after `kill(-1, SIGKILL)`.
#
# - ExecStart runs /usr/local/sbin/pm2-const-start as root ("+" prefix): it
#   adopts an already-running God daemon into this cgroup instead of killing
#   the apps, or runs `pm2 resurrect` as const when none is alive.
# - Restart=always: when the cgroup empties (mass SIGKILL, `pm2 kill` from a
#   shell) systemd brings pm2 + every saved app back after 5 s.
# - PIDFile in /run so systemd accepts a main pid it did not fork.
#
# Reversible: delete this file and the script, then `systemctl daemon-reload`.
[Service]
Restart=always
RestartSec=5s
PIDFile=/run/pm2-const.pid
ExecStart=
ExecStart=+/usr/local/sbin/pm2-const-start
