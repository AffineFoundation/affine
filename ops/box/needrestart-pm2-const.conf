# /etc/needrestart/conf.d/50-pm2-const.conf
#
# needrestart is Ubuntu's post-apt hook: after any `apt-get install/upgrade`
# it restarts every service whose processes still map a library that the
# upgrade replaced. In non-interactive mode (DEBIAN_FRONTEND=noninteractive,
# which every agent uses) it does so without asking.
#
# 2026-09-13 09:15:04 UTC: `apt-get install build-essential pkg-config`
# pulled a libbz2 upgrade -> needrestart ran `systemctl restart pm2-const`
# -> all 20 pm2 apps restarted, duel chal-00466 interrupted and requeued.
#
# pm2-const carries the validator and must never be restarted by a package
# hook. 0 = never restart this service (still listed in the report).
$nrconf{override_rc}{qr(^pm2-const\.service$)} = 0;
$nrconf{override_rc}{qr(^pm2-const$)} = 0;
