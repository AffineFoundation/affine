[project]
name = "affine-trivia-abstain-v1"
version = "0.1.0"
description = "affine-trivia-abstain-v1 — TriviaQA closed-book QA (train split, zero-shot) with abstention credit: `solved` = correct or \"I don't know\", wrong answer 0; AA-Omniscience-shaped +1/0/-1 metric."
requires-python = ">=3.10"
dependencies = ["datasets", "triviaqa-v1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["affine_trivia_abstain_v1"]
