[project]
name = "affine-rgym-v1"
version = "0.1.0"
description = "affine-rgym-v1 — reasoning-gym procedural puzzles (v1 port of primeintellect/reasoning-gym-env) at raised curriculum difficulty; per-(generator, index) seeding, text dialect, correct reward."
requires-python = ">=3.10"
dependencies = ["reasoning-gym"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["affine_rgym_v1"]
