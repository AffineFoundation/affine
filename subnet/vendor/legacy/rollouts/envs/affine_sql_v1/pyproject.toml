[project]
name = "affine-sql-v1"
version = "0.1.0"
description = "affine-sql-v1 — text-to-SQL over Spider train: the task database in a sqlite sandbox, final answer one ```sql block, graded by result-set equality against the gold query."
requires-python = ">=3.10"
dependencies = ["datasets", "huggingface_hub"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["affine_sql_v1"]
