[project]
name = "affine-eog-v1"
version = "0.1.0"
description = "affine-eog-v1 — EnterpriseOps-Gym (649 stateful enterprise tool-use tasks over 7 MCP services in Docker); `tasks` selector, `solved` reward alias of database_state."
requires-python = ">=3.11"
dependencies = ["enterprise-ops-gym-v1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["affine_eog_v1"]
