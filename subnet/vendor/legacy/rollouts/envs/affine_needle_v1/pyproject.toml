[project]
name = "affine-needle-v1"
version = "0.1.0"
description = "affine-needle-v1 — patterned needle-in-a-haystack (long-context pattern outlier), procedurally generated with per-index seeding, single-turn \\boxed{} answer, `correct` reward."
requires-python = ">=3.10"
dependencies = ["patterned-needle-in-haystack-v1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["affine_needle_v1"]
