[project]
name = "affine-i3math-v1"
version = "0.1.0"
description = "affine-i3math-v1 — INTELLECT-3-RL math, boxed answer, math-verify in the runtime; system message with the boxed mandate, task selector, difficulty band."
requires-python = ">=3.10"
dependencies = ["i3-math-v1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["affine_i3math_v1"]
