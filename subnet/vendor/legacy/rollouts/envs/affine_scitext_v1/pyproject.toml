[project]
name = "affine-scitext-v1"
version = "0.1.0"
description = "affine-scitext-v1 — teacher-synthesized variants of open textbook/olympiad science problems, answer checked by executing the teacher's solution code; boxed dialect, math-verify grading (HLE-shaped supply; HLE never used)."
requires-python = ">=3.11"
dependencies = ["affine-gen-v1", "datasets"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["affine_scitext_v1"]
