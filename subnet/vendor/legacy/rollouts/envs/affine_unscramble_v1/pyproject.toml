[project]
name = "affine-unscramble-v1"
version = "0.1.0"
description = "affine-unscramble-v1 — sentence re-ordering (unscramble-v1), single-turn text answer; `correct` = exact order, `similarity` kept as a metric."
requires-python = ">=3.10"
dependencies = ["datasets", "unscramble-v1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["affine_unscramble_v1"]
