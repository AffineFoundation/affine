[project]
name = "affine-prolog-v1"
version = "0.1.0"
description = "affine-prolog-v1 — procedurally generated SWI-Prolog constraint problems (prolog-v1) with per-index seeding so tasks are addressable by name; sandbox, `solved` reward."
requires-python = ">=3.10"
dependencies = ["prolog-v1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["affine_prolog_v1"]
