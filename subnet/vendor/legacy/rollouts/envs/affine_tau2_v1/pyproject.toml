[project]
name = "affine-tau2-v1"
version = "0.1.0"
description = "affine-tau2-v1 — τ²-bench telecom customer-service tasks (full split minus the benchmarked base split) with an LLM user simulator; taskset + harness, `solved` reward."
requires-python = ">=3.11"
dependencies = ["tau2-bench-v1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["affine_tau2_v1"]
