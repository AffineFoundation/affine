[project]
name = "affine-kb-synth-v1"
version = "0.1.0"
description = "affine-kb-synth-v1 — tau2-synth customer-service domains with the policy moved into a BM25 knowledge base behind tau3's KB_search tool (search-before-answering state); tau2 rewards, DeepSeek customer."
requires-python = ">=3.10"
