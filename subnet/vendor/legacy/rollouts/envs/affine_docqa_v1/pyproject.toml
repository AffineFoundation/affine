[project]
name = "affine-docqa-v1"
version = "0.1.0"
description = "affine-docqa-v1 — teacher-generated multi-document questions over bundles of public documents (EDGAR, GOV.UK, Europe PMC CC-BY), 60-95k tokens inline (AA-LCR-shaped)."
requires-python = ">=3.11"
dependencies = ["affine-gen-v1", "httpx", "boto3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["affine_docqa_v1"]
