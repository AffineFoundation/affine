[project]
name = "affine-scicomp-v1"
version = "0.1.0"
description = "affine-scicomp-v1 — teacher-generated scientific-computing Python functions with hidden pytest tests run in the rollout runtime (SciCode-shaped; SciCode itself never used)."
requires-python = ">=3.11"
dependencies = ["affine-gen-v1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["affine_scicomp_v1"]
