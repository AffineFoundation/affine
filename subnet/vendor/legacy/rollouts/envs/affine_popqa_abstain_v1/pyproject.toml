[project]
name = "affine-popqa-abstain-v1"
version = "0.1.0"
description = "affine-popqa-abstain-v1 — PopQA long-tail facts with abstention credit (solved = correct or \"I don't know\"; AA-Omniscience-shaped +1/0/-1 metric)."
requires-python = ">=3.10"
dependencies = ["datasets", "triviaqa-v1", "affine-trivia-abstain-v1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["affine_popqa_abstain_v1"]
