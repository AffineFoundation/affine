[project]
name = "fastbench"
version = "0.1.0"
description = "Dedicated fast SWE-rebench bench box: bench(n, seed, model) -> score."
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pyyaml>=6",
    "huggingface_hub>=0.30",
    "hf_transfer>=0.1.8",
    "datasets>=3.0",
    "pyarrow>=17",
    "mini-swe-agent>=2.4",
]

[project.optional-dependencies]
# GPU pod extra. The SWE-rebench harness fork is installed by bootstrap.sh
# (git URL, matching the proven evalsrv stack).
serve = [
    "vllm>=0.8",
    "transformers>=4.51",
]

[project.scripts]
fastbench-server = "fastbench.server:main"
fastbench = "fastbench.client:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fastbench*"]

[tool.setuptools.package-data]
fastbench = ["data/*.json"]
