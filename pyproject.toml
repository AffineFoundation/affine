[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "affine-epoch-subnet"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["boto3>=1.40", "PyNaCl>=1.5", "requests>=2.32", "numpy>=2", "torch>=2.12", "transformers>=5.14", "verifiers==0.3.1", "toploc==0.1.6", "safetensors>=0.8", "bittensor==11.0.2"]

[project.scripts]
affine-miner = "subnet.cli:main"
affine-verifier = "subnet.verifier:main"
affine-trainer = "subnet.trainer:main"
affine-controller = "subnet.service:main"
affine-mock = "subnet.mock:main"

[tool.setuptools]
packages = ["subnet"]
