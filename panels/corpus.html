<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Affine observatory</title>
<style>
:root{font-family:var(--font-sans,system-ui,sans-serif);color:var(--color-text,#d6d0d4);background:var(--color-canvas,#2c262a);font-size:13px}*{box-sizing:border-box}body{margin:0;padding:22px}header{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}h1{font-size:25px;letter-spacing:-.7px;color:var(--color-bright,#ece7ea);margin:5px 0 8px;font-weight:600}h2{font-size:13px;font-weight:550;color:var(--color-bright,#ece7ea);margin:0 0 12px}p{line-height:1.6;margin:6px 0}.eyebrow{font:10px var(--font-mono,monospace);letter-spacing:2px;color:var(--color-accent,#85aab3)}.subtitle,.detail,footer,.meta{color:var(--color-muted,#968f94);font-size:11px}.subtitle{max-width:75ch}.badge{white-space:nowrap;font:10px var(--font-mono,monospace);border:1px solid var(--color-line,#3e373c);border-radius:20px;padding:7px 10px}.ok,.green{color:var(--color-green,#87a883)}.warn{color:var(--color-warn,#c9a86a)}.error,.red{color:var(--color-red,#c97f77)}.unknown{color:var(--color-muted,#968f94)}.accent{color:var(--color-accent,#85aab3)}.meta{display:flex;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--color-line,#3e373c);padding:10px 0 15px;margin-bottom:16px}.flow{background:var(--color-panel,#312b2f);border-left:2px solid var(--color-accent,#85aab3);padding:12px 14px;margin:16px 0}.flow strong{font:11px var(--font-mono,monospace);color:var(--color-accent,#85aab3)}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:9px;margin:16px 0}.metric{padding:14px;background:var(--color-card,#332a2f);border:1px solid var(--color-line,#3e373c);border-radius:7px;min-width:0}.label{font-size:10px;color:var(--color-muted,#968f94);margin-bottom:9px}.value{font:500 24px var(--font-mono,monospace);color:var(--color-bright,#ece7ea);overflow-wrap:anywhere;line-height:1.3}.value.long{font-size:15px}.metric .detail{margin-top:8px;line-height:1.5}.section{margin-top:18px;padding-top:16px;border-top:1px solid var(--color-line,#3e373c)}.bars{display:grid;gap:12px}.bar-head{display:flex;justify-content:space-between;gap:12px;margin-bottom:6px;font-size:11px}.track{height:5px;background:var(--color-bar,#262024);border-radius:4px;overflow:hidden}.fill{height:100%;background:var(--color-accent,#85aab3)}.fill.warn{background:var(--color-warn,#c9a86a)}.fill.green{background:var(--color-green,#87a883)}.fill.red,.fill.error{background:var(--color-red,#c97f77)}.bar .detail{margin-top:5px}table{border-collapse:collapse;width:100%;font:10px var(--font-mono,monospace)}th{text-align:left;color:var(--color-muted,#968f94);font-weight:400;position:sticky;top:0;background:var(--color-panel,#312b2f)}td,th{padding:9px 10px;border-bottom:1px solid var(--color-line,#3e373c);vertical-align:top}td{color:var(--color-text,#d6d0d4)}.table-wrap{overflow:auto;max-height:300px;border:1px solid var(--color-line,#3e373c);border-radius:5px}details{margin:12px 0}summary{cursor:pointer;color:var(--color-muted,#968f94);font-size:11px;padding:8px 0}li{font-size:11px;line-height:1.6;margin:7px 0}ul{padding-left:18px}footer{margin-top:20px;font:10px var(--font-mono,monospace);overflow-wrap:anywhere;line-height:1.7}.chart{width:100%;height:175px;display:block;background:var(--color-bar,#262024);border-radius:5px}.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:10px;margin:7px 0}.lane{margin-top:20px}.lane-title{text-transform:uppercase;letter-spacing:1.7px;font-size:9px;color:var(--color-muted,#968f94);margin:10px 0}.nodes{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:8px}.node{text-align:left;border:1px solid var(--color-line,#3e373c);border-radius:6px;background:var(--color-card,#332a2f);padding:12px;color:var(--color-text,#d6d0d4);cursor:pointer}.node:hover{border-color:var(--color-accent,#85aab3)}.node strong{display:block;font-size:12px;margin:7px 0}.node small{display:block;font-size:10px;color:var(--color-muted,#968f94);line-height:1.5}.node .badge{font-size:9px;padding:2px 5px;display:inline-block}.warning{padding:10px;background:var(--color-panel,#312b2f);color:var(--color-warn,#c9a86a);font-size:11px;border:1px solid var(--color-line,#3e373c);border-radius:5px;margin:12px 0}.hidden{display:none}@media(max-width:450px){body{padding:14px}.value{font-size:20px}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}header{gap:8px}h1{font-size:22px}}
</style></head><body>
<header><div><div class="eyebrow">AFFINE / SN120 · OBSERVATORY</div><h1 id="title">Connecting…</h1><p class="subtitle" id="subtitle">Waiting for the read-only telemetry bridge.</p></div><span class="badge unknown" id="status">WAITING</span></header>
<div class="meta"><span id="freshness">No sample received</span><span id="cadence"></span><span>READ ONLY</span></div>
<div id="stale" class="warning hidden"></div><div class="flow"><strong id="flow"></strong><p class="detail" id="purpose"></p></div>
<div id="metrics" class="metrics"></div><div id="map"></div><div id="charts"></div><div id="bars" class="bars"></div><div id="sections"></div>
<details id="notes"><summary>Interpretation & monitoring limits</summary><ul id="note-list"></ul></details><details id="sources"><summary>Evidence sources</summary><footer id="source-list"></footer></details>
<footer id="foot">Derived telemetry only · no production controls</footer>
<script>
'use strict';
const PANEL_ID="corpus";
const DATA_PATH="/home/const/subnet120/panels/data/corpus.json";
const META={
overview:['SYSTEM / READ LEFT → RIGHT','Private submissions → queue → duel → crown → weights. Teacher serving and the versioned corpus feed evaluation; benchmarks, chat and audits branch from crowns. Click a subsystem to bring its panel into view.'],
validator:['CHAIN → INTAKE → DISPATCH → PUBLISH','The asynchronous CPU control plane keeps intake, weights, health checks and publication moving while one duel runs.'],
weights:['CROWN → ACCESSIBILITY → RECIPIENT WINDOW → CHAIN','Accessible distinct kings form an equal-share payout window. Recorded successful writes are not independently confirmed chain payments.'],
registrations:['ACTIVATE → SEALED UPLOAD → READY → VERIFY','Ed25519 activation grants temporary private R2 upload access. Ready revokes it; manifest, inventory, hygiene and architecture checks gate admission.'],
queue:['ADMITTED CHECKPOINT → WAITING → IN FLIGHT','Canonical queue order is preserved. Infrastructure faults requeue/defer independently from miner rejection; a historical registration is not queue membership.'],
eval:['PINNED CHECKPOINT → HASH CHECK → vLLM SLOTS','The evaluation service owns GPU scheduling, model loads and corpus sync. Warm king and teacher slots serve each fresh challenger.'],
duel:['SEED → STRATIFIED SLICE → FRESH REFS → TWO SIDES','Reveal-block entropy pins a reproducible slice. Fresh teacher references are shared only within this duel; SSE streams progress back to the validator.'],
scores:['TEACHER ECHOES → min(R, G) → PAIRED TEST + GATES','Centered Reason cancels flat lift; two-sided Grounding penalizes out-of-band thoughts. The forfeit floor, δ, length and B license complete the live min_rg contract.'],
dialects:['TURN ACTION KIND → PARSE → REFS → B LICENSE','Bash, tool_call and boxed have different parsing and reference behavior. Rates below are published per-dialect summaries, not recomputed scores.'],
history:['VERDICT → IMMUTABLE ARTIFACT → KING LINEAGE','Completed duel margins retain their original parameter regimes. Positive margin alone does not imply a crown; history is not a liveness heartbeat.'],
teacher:['SWARM MANAGER → ROUTED REPLICAS → TEACHER','The independent teacher fleet serves samples and logprob echoes. Manager state is compared with live routed membership.'],
router:['PREFIX AFFINITY → BACKEND → CIRCUIT / RETRY','Rendezvous routing preserves cache locality; spill and circuit breakers handle saturation and failure. Throughput windows are router measurements.'],
datagen:['SOURCE TASK × POLICY × HARNESS → TRAJECTORY','Read-only worker observations expose reachability, rollout supervisor counts and bounded log timestamps, not proof that a task succeeded.'],
traces:['ROLLOUT GRAPH → IMMUTABLE CHUNKS → TRACE MANIFEST','Full task, policy and message graphs are canonical. The trace manifest reveals publication freshness and source volume.'],
'corpus-fold':['TRACES → VALIDATE / DEDUP → STRATA MIX → PUBLISH','Daily folds derive duel_turns@v4, bake tools, preserve sampled ancestor paths and publish schema-3 views. Mix targets strata, not raw turn counts.'],
corpus:['PINNED MANIFEST → INDEX → SEEDED SLICE → PREFIX','Immutable provenance enables replay. Total source turn shares and expected duel-slice strata shares are deliberately shown separately.'],
'bench-engine':['CROWN → BENCH QUEUE → MODEL + SANDBOX','Dedicated benchmark serving and Docker task execution are separate from ranked duels. Engine health does not establish benchmark quality.'],
benchmarks:['BENCH RUNS → TASK OUTCOMES → ADVISORY RESULTS','Benchmark scores never enter the duel score. RT-7 remains open: higher distillation score and a crown do not guarantee coding capability.'],
audits:['CROWN → PINNED EVIDENCE → AUDIT → POSSIBLE REVERT','Post-crown audits are separate from numeric scoring. Reported verdict, confidence and coverage are evidence to inspect, not independent proof.'],
chat:['PUBLIC KING SNAPSHOT → RELOAD → CHAT','The public chat service follows the king but has no scoring or weight-setting role. Loading can be live without being ready to generate.'],
services:['PM2 → CPU SERVICES / TUNNELS / SCHEDULED FOLD','Process status is distinct from application health. Scheduled-idle and retired services are not incorrectly counted as outages.'],
fleet:['PROVISIONERS → RENTED GPU PODS → ROLE SERVICES','Current cloud inventory and hourly price estimates only; no rental, restart or actual billing actions are performed.'],
host:['VALIDATOR HOST → CPU / MEMORY / DISK / NETWORK','Direct one-second host observations via the arbos system bridge. This is the control-plane host, not remote GPU telemetry.']
};
const $=id=>document.getElementById(id);let latest=null,lastText='',lastSystem=0,expanded={},history=[];
const str=v=>v===null||v===undefined?'Unknown':typeof v==='object'?JSON.stringify(v):String(v);
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=str(text);return n}
function section(title){const n=el('section','section');n.append(el('h2','',title));return n}
function finite(n){return typeof n==='number'&&Number.isFinite(n)}
function tone(s){return ['ok','warn','error','green','red','accent','unknown'].includes(s)?s:''}
function statusFor(d){const age=(Date.now()-Date.parse(d.collected_at))/1000;return !Number.isFinite(age)||age< -60||age>(d.stale_after_seconds||45)?'unknown':d.status||'unknown'}
function tick(){if(!latest)return;const age=(Date.now()-Date.parse(latest.collected_at))/1000,stale=statusFor(latest)==='unknown';$('status').className='badge '+(stale?'warn':tone(latest.status));$('status').textContent=stale?'STALE / UNKNOWN':latest.status==='ok'?'OBSERVED':latest.status==='warn'?'REVIEW':'ERROR';$('freshness').textContent=Number.isFinite(age)?'Collected '+Math.max(0,Math.floor(age))+'s ago · '+new Date(latest.collected_at).toLocaleTimeString():'Collection time unknown';$('stale').classList.toggle('hidden',!stale);$('stale').textContent='Telemetry is stale or unavailable. Values below are the last observation, not current health.';document.querySelectorAll('[data-node]').forEach(n=>{const node=(latest.nodes||[]).find(x=>x.id===n.dataset.node);if(node){const s=statusFor(node),b=n.querySelector('.badge');b.className='badge '+s;b.textContent=s==='unknown'?'STALE / UNKNOWN':s.toUpperCase()}})}
function svgEl(tag,attrs){const n=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const[k,v]of Object.entries(attrs))n.setAttribute(k,v);return n}
function chart(spec){const box=section(spec.title),svg=svgEl('svg',{viewBox:'0 0 640 180',class:'chart',role:'img','aria-label':spec.title});const series=spec.series||[],vals=series.flatMap(s=>s.values||[]).filter(finite);if(!vals.length){box.append(el('p','detail','No measured points available'));return box}let lo=Math.min(0,...vals),hi=Math.max(...vals);if(hi===lo)hi=lo+1;const count=Math.max(2,...series.map(s=>(s.values||[]).length)),x=i=>55+i*565/(count-1),y=v=>145-(v-lo)*125/(hi-lo);for(const v of [lo,(lo+hi)/2,hi]){svg.append(svgEl('line',{x1:55,x2:620,y1:y(v),y2:y(v),stroke:'var(--color-line, #3e373c)'}));const t=svgEl('text',{x:5,y:y(v)+3,fill:'var(--color-muted, #968f94)','font-size':9});t.textContent=v.toPrecision(3);svg.append(t)}const colors=['accent','green','warn','red'],fallback=['#85aab3','#87a883','#c9a86a','#c97f77'],legend=el('div','legend');series.forEach((s,i)=>{const color=`var(--color-${colors[i%4]}, ${fallback[i%4]})`;let prev=null;(s.values||[]).forEach((v,j)=>{if(!finite(v)){prev=null;return}if(prev)svg.append(svgEl('line',{x1:prev[0],y1:prev[1],x2:x(j),y2:y(v),stroke:color,'stroke-width':1.6,'stroke-dasharray':i>=4?'4 3':'none'}));const c=svgEl('circle',{cx:x(j),cy:y(v),r:2.5,fill:color}),t=svgEl('title',{});t.textContent=`${s.name}: ${(spec.labels||[])[j]||j} = ${v}`;c.append(t);svg.append(c);prev=[x(j),y(v)]});const item=el('span','',s.name);item.style.color=color;legend.append(item)});const labels=spec.labels||[];for(const [i,anchor]of [[0,'start'],[labels.length-1,'end']]){if(i<0)continue;const t=svgEl('text',{x:anchor==='start'?55:620,y:167,fill:'var(--color-muted, #968f94)','font-size':9,'text-anchor':anchor});t.textContent=labels[i]||'';svg.append(t)}box.append(svg,legend);return box}
function render(d){latest=d;document.title=d.title;$('title').textContent=d.title;$('subtitle').textContent=d.subtitle;$('cadence').textContent=`Source refresh ~${d.refresh_seconds||'?'}s`;$('flow').textContent=(META[PANEL_ID]||[])[0]||'';$('purpose').textContent=(META[PANEL_ID]||[])[1]||'';
$('metrics').replaceChildren(...(d.metrics||[]).map(m=>{const n=el('div','metric'),v=el('div','value '+(str(m.value).length>18?'long ':'')+tone(m.tone),m.value);if(tone(m.tone))v.style.color=`var(--color-${m.tone==='error'?'red':m.tone==='ok'?'green':m.tone}, var(--color-bright, #ece7ea))`;n.append(el('div','label',m.label),v,el('div','detail',m.detail||''));return n}));
$('bars').replaceChildren(...(d.bars||[]).map(b=>{const n=el('div','bar'),h=el('div','bar-head'),track=el('div','track'),fill=el('div','fill '+tone(b.tone));h.append(el('span','',b.label),el('span','detail',finite(b.value)?str(b.value)+' / '+str(b.max):'Unknown'));fill.style.width=finite(b.value)&&finite(b.max)&&b.max>0?Math.max(0,Math.min(100,100*b.value/b.max))+'%':'0%';track.append(fill);n.append(h,track,el('div','detail',b.detail||''));return n}));
$('charts').replaceChildren(...(d.charts||[]).map(chart));$('sections').replaceChildren(...(d.sections||[]).map(s=>{const n=section(s.title),wrap=el('div','table-wrap'),t=el('table'),head=el('thead'),tr=el('tr'),body=el('tbody');for(const c of s.columns||[])tr.append(el('th','',c));head.append(tr);for(const row of s.rows||[]){const r=el('tr');for(const c of row)r.append(el('td','',c));body.append(r)}t.append(head,body);wrap.append(t);n.append(wrap);if(!(s.rows||[]).length)n.append(el('p','detail','No rows reported'));return n}));
$('note-list').replaceChildren(...(d.notes||[]).map(n=>el('li','',n)));$('source-list').replaceChildren(...(d.sources||[]).map(n=>el('div','',n)));$('foot').textContent='Read-only · '+(d.collected_at||'No timestamp')+(d.collection_seconds!==undefined?' · probe '+d.collection_seconds+'s':'');
const map=$('map');map.replaceChildren();if(d.nodes){for(const lane of [...new Set(d.nodes.map(n=>n.lane))]){const group=el('div','lane'),nodes=el('div','nodes');group.append(el('div','lane-title',lane+' →'));for(const item of d.nodes.filter(n=>n.lane===lane)){const b=el('button','node');b.dataset.node=item.id;b.append(el('span','badge '+statusFor(item),statusFor(item).toUpperCase()),el('strong','',item.title));for(const m of item.metrics||[])b.append(el('small','',m.label+': '+str(m.value)));b.onclick=()=>{if(window.arbos)window.arbos.emit('focus-monitor',{panel:item.id})};nodes.append(b)}group.append(nodes);map.append(group)}}tick()}
function host(s){lastSystem=Date.now();const cpu=s.cpu||{},mem=s.mem||{};history.push({t:new Date(s.time||Date.now()).toLocaleTimeString(),cpu:cpu.percent,mem:mem.percent});if(history.length>120)history.shift();render({title:'Validator host',subtitle:'Direct system bridge · 1-second samples',status:'ok',collected_at:new Date().toISOString(),refresh_seconds:1,stale_after_seconds:5,metrics:[{label:'CPU',value:finite(cpu.percent)?cpu.percent.toFixed(1)+'%':'Unknown',detail:cpu.cores+' cores'},{label:'Memory',value:finite(mem.percent)?mem.percent.toFixed(1)+'%':'Unknown',detail:finite(mem.used)?(mem.used/2**30).toFixed(1)+' GiB used':''},{label:'Load · 1 minute',value:(s.load||{}).one},{label:'Host',value:(s.host||{}).name}],charts:[{title:'Last 120 observations (%)',labels:history.map(p=>p.t),series:[{name:'CPU',values:history.map(p=>p.cpu)},{name:'Memory',values:history.map(p=>p.mem)}]}],bars:(s.disk||[]).map(d=>({label:d.mount,value:d.percent,max:100,detail:'Disk used',tone:d.percent>90?'warn':''})),sections:[{title:'Top processes · host snapshot',columns:['Process','PID','CPU %','RSS MiB'],rows:(s.procs||[]).slice(0,8).map(p=>[p.name,p.pid,p.cpu_percent,finite(p.rss)?(p.rss/2**20).toFixed(0):null])}],notes:['Host percentages are not GPU utilization. Chart history is session-local and starts when this panel opens.'],sources:['arbos.system → /api/system']})}
document.addEventListener('DOMContentLoaded',()=>{const meta=META[PANEL_ID]||[];$('flow').textContent=meta[0]||'';$('purpose').textContent=meta[1]||'';if(!window.arbos){$('stale').classList.remove('hidden');$('stale').textContent='Live bridge unavailable. Open this artifact as an arbos canvas to receive telemetry.';return}const a=window.arbos;if(a.state){a.state.subscribe(doc=>{expanded=doc.expanded||{};for(const id of ['notes','sources'])$(id).open=!!expanded[id]});for(const id of ['notes','sources'])$(id).addEventListener('toggle',()=>{if(!!expanded[id]!==$(id).open)a.state.set({expanded:{...expanded,[id]:$(id).open}})})}if(PANEL_ID==='host'){a.system(host,{interval:1000})}else{a.subscribe('/api/file?path='+encodeURIComponent(DATA_PATH),payload=>{try{if(payload.truncated||typeof payload.content!=='string')throw Error();if(payload.content===lastText)return;const d=JSON.parse(payload.content);if(!d.title||!d.collected_at)throw Error();lastText=payload.content;render(d)}catch{ $('stale').classList.remove('hidden');$('stale').textContent='Invalid telemetry response; last valid observation retained.'}},{interval:3000})}setInterval(tick,1000)});
</script></body></html>
