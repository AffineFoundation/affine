[project]
name = "affine-sn120-v2"
version = "0.1.0"
description = "Affine SN120 v2: batch -> LoRA tournament control plane"
# 3.11 is the floor the code needs (typing.Self, hashlib.file_digest, tomllib).
requires-python = ">=3.11"
# The control plane is standard library only. Heavy stacks live in extras, so
# the controller, the tests and the CPU simulation install in seconds.
dependencies = []

[project.optional-dependencies]
# boto3 and moto let the R2 store tests run against a local S3 fake instead of skipping.
dev = ["pytest>=8", "boto3>=1.36", "moto[server]>=5", "pynacl>=1.5"]
# One line per sibling workstream. Edit only your own line, and add each new
# import name to tests/third_party_imports.txt.
gpu = ["torch", "transformers>=5.12", "safetensors", "huggingface_hub", "vllm==0.32.0", "flash-linear-attention==0.6.0"]    # train/eval workers
r2 = ["boto3>=1.36"]  # R2 head store
chain = ["bittensor==11.0.2"]  # weights writer and chain reader
miner = ["transformers>=4.44", "jinja2>=3.1"]  # miner tooling and llms.txt: the tokenizer for the local token rules; its chat template needs jinja2
bench = []  # per-green benchmark service
links = ["pynacl>=1.5"]  # sealed upload links: sealed box and Ed25519 check (run the job with the r2 and chain extras too)
envs = ["math-verify==0.9.0", "latex2sympy2-extended==1.11.0", "sympy==1.14.0", "antlr4-python3-runtime==4.13.2", "mpmath==1.3.0"]  # math grader
# The CUDA kernel that transformers takes for the causal convolution of the head's linear-attention layers.
# Without it transformers runs the same convolution in torch, so this extra is not needed for a correct result.
# It is not in `gpu`: PyPI has only the source, the build needs nvcc, and it must compile against the torch that
# is installed. So install it second, in an environment that has the gpu extra:
#   uv pip install setuptools wheel packaging ninja
#   CAUSAL_CONV1D_FORCE_BUILD=TRUE uv pip install --no-cache -e ".[conv]"
#   python -c "import causal_conv1d"    # an error here means: no kernel, and transformers uses torch with no word
conv = ["causal-conv1d==1.7.0"]

[tool.uv.pip]
# In an isolated build uv gives causal-conv1d the newest torch, not the installed one.
no-build-isolation-package = ["causal-conv1d"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The whole package directory ships, so a new subpackage needs no edit here.
packages = ["sn120_v2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
