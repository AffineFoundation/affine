[project]
name = "arxivmath"
version = "0.1.0"
description = "ArXivMath (MathArena, 103 research-level questions from arXiv papers, Dec 2025 - Mar 2026) -- Affine bench env (verifiers v1, math-verify scoring)"
requires-python = ">=3.11"
dependencies = ["verifiers>=0.4.0", "math-verify>=0.8.0", "datasets"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["arxivmath"]
