[project]
name = "affine-math-grader"
version = "0.1.0"
description = "Shared rule-based grader for Affine public math contest benchmark environments"
requires-python = ">=3.11"
dependencies = ["verifiers>=0.4.0", "math-verify>=0.8.0", "datasets"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["affine_math_grader"]
