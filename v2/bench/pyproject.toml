[project]
name = "affine-bench"
version = "0.2.0"
description = "Affine SN120 v2 per-green benchmark: serves each applied king on vLLM, runs verifiers envs, writes benchmarks.json"
requires-python = ">=3.11"
# The node installs this package alone. The host also needs affine-sn120-v2 (the parent directory) installed.
dependencies = []

[project.scripts]
affine-bench = "affine_bench.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["affine_bench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
