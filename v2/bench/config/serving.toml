# How a node serves a model for affine-bench-v2: the start of the vLLM server and the limit of the client.
# There is no sampling value here. The sampling of a run is the profile of its model in model_settings.toml:
# node_run sends temperature/top_p/top_k/min_p/presence_penalty/repetition_penalty/max_tokens with each request.
# This file goes into the public table as `serving`; the profiles that the rows name go into it as `profiles` (publish.py).
# Bump `version` whenever anything that changes scores changes; results carry it.
version = "bench-v2"
[server]
engine = "vllm==0.32.0"
data_parallel = "all GPUs (one replica per GPU)"
dtype = "bfloat16"
# The window of a server that is started with none given (serve.sh). A run gives the max_model_len of its profile.
max_model_len = 69632
max_num_seqs = 512
gpu_memory_utilization = 0.90
# The engine keeps its own defaults and does not load a model's generation_config.json
# (that would fight the per-model protocol).
generation_config = "vllm"
[client]
max_concurrent_total = 3072
