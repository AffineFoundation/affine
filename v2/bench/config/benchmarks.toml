# Benchmark registry. Adding a benchmark = adding a [[benchmark]] block (and installing its env on the node via
# deploy/requirements-envs.lock or bench/environments/). The table/charts on affine.io render columns from this file.
#   id        stable column id (results are keyed by it; bump `version` when anything that changes scores changes)
#   suite     math | code | terminal | search | agent ... (columns are grouped by suite)
#   env       verifiers taskset id installed on the node (vf-eval <env>)
#   source    where the env comes from: hub:<owner>/<name>@<version> or repo:bench/environments/<dir>
#   rollouts  -r: samples per problem (score = mean over problems of the per-problem mean)
#   harness / runtime  verifiers agent harness + runtime (null = one plain chat turn, no tools)
#   enabled   the daemon only schedules enabled benchmarks
#   in_avg    false = display-only column on affine.io: left out of Avg, the reference (Pareto) filter, column stars and shading;
#             flip to true (or delete the line) once every shown row has it (default true)
#   publish_per_task  never true for anything drawn from the MATH test split (our private holdout comes from it)
[defaults]
harness = "null"
runtime = "subprocess"
version = 1

[[benchmark]]
id = "math500"
label = "MATH-500"
suite = "math"
env = "local-math500"
source = "hub:primeintellect/math500@0.1.18"
dataset = "HuggingFaceH4/MATH-500@6e4ed1a2a79af7d8630a6b768ec859cb5af4d3be (test, 500)"
rollouts = 1
enabled = true
order = 10

[[benchmark]]
id = "math"
label = "MATH (5,000)"
suite = "math"
env = "math-test"
source = "repo:bench/environments/math-test"
dataset = "DigitalLearningGmbH/MATH-lighteval@0530c78699ea5e8eb5530600900e1f328b48acad (default/test, 5000)"
rollouts = 1
enabled = true
order = 20

